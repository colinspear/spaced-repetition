const DECKS = [{"deck":"gov","code":"GOV","title":"Data governance","blurb":"Roles, operating models, definitions and quality: the vocabulary and moves for running governance without hand-waving.","cards":[{"id":"gov-01","kind":"concept","prompt":"Owner, steward, custodian. Who is accountable, who is responsible, and who holds the keys?","answer":"Owner: accountable for the data asset. Approves definitions, access and quality targets. Usually a business leader. Steward: responsible day to day for definitions, quality rules, metadata and issue triage, acting for the owner. A subject-matter expert. Custodian: technical custody. Storage, security controls, backups, implementing the rules. Usually IT or a DBA.","points":["Owner = accountability and decision rights, one per asset","Steward = day-to-day responsibility for meaning and quality","Custodian = technical operation and controls, not business meaning","Terms vary across frameworks, so define them in the charter"],"source":"DAMA-DMBOK2, ch. 3 (Data Governance)"},{"id":"gov-02","kind":"fact","prompt":"In the DAMA-DMBOK2 wheel, which knowledge area sits at the hub, and how many surround it?","answer":"Data Governance at the hub, with 10 knowledge areas around it (11 in total).","why":"The ten: architecture; modeling & design; storage & operations; security; integration & interoperability; document & content; reference & master data; warehousing & BI; metadata; data quality.","source":"DAMA-DMBOK2, ch. 1"},{"id":"gov-03","kind":"concept","prompt":"What is the core move of Seiner's 'non-invasive data governance'?","answer":"Formalize the accountability people already have for the data they define, produce and use, instead of inventing new roles and new work. Governance recognizes existing stewards and adds structure around them.","points":["Recognize existing behavior rather than assign new duties","Anyone who defines, produces or uses data already has a stewardship relationship to it","Lower adoption cost, which matters where people are stretched"],"source":"Robert S. Seiner, Non-Invasive Data Governance (2014)"},{"id":"gov-04","kind":"fact","prompt":"A customer record has a real, correctly formatted postal code, but it belongs to a different town than the one the customer lives in. Which quality dimension failed: validity or accuracy?","answer":"Accuracy. The code passes the format and domain rules, so it is valid, but it doesn't match reality.","why":"Validity = conforms to format and domain rules. Accuracy = matches the real-world thing. A validation rule can't catch an accuracy error; that takes a reference source or verification.","source":"DAMA UK, The Six Primary Dimensions for Data Quality Assessment (2013)"},{"id":"gov-05","kind":"fact","prompt":"Name the six DAMA UK data quality dimensions.","answer":"Completeness, uniqueness, timeliness, validity, accuracy, consistency.","why":"Mnemonic: CUT VAC.","source":"DAMA UK (2013)"},{"id":"gov-06","kind":"concept","prompt":"What is a critical data element, and why does governance start there?","answer":"A data element whose quality materially affects key decisions, operations, or legal and regulatory obligations. You can't govern everything at once. CDEs focus definitions, quality rules and stewardship where errors cost the most.","points":["Defined by the consequence of error, not by volume","Gives governance a finite, prioritized scope","Owners and quality rules get attached to CDEs first"],"source":"Common practice; DAMA-DMBOK2 ch. 13 (Data Quality)"},{"id":"gov-07","kind":"concept","prompt":"Centralized, decentralized or federated: which governance operating model fits an organization with a small central data office, and what does it look like?","answer":"Federated (hub and spoke). The central office sets standards, policy and tools and convenes people. Business units keep ownership and do the work through local stewards. A council or committee connects the hub to the spokes.","points":["Central office: standards, policy, tools, convening","Business units own their data and execute","A council or community links hub and spokes","Pure centralization doesn't scale with a small office; pure decentralization fragments definitions"],"source":"DAMA-DMBOK2, ch. 3"},{"id":"gov-08","kind":"judgment","prompt":"A department head says: 'We don't have time to name a data steward.' You need their core operational data governed. What do you propose?","answer":"Someone already answers questions about that data, so name that person and formalize what they already do rather than adding a new job. Shrink the ask to a handful of critical fields and an hour or two a month. Tie it to a pain they feel, such as fewer ad hoc requests or numbers they can defend. Start with one visible use case, and go through the sponsor or council only if this stalls.","points":["Reframe as recognizing an existing role (non-invasive)","Shrink the ask: a few critical data elements, time-boxed","Show what they get back (fewer requests, defensible numbers)","Start from one painful, visible use case","Escalate through the executive sponsor or council only if needed"],"source":"Synthesis: Seiner; DMBOK2 ch. 3"},{"id":"gov-09","kind":"fact","prompt":"RACI: what do the letters stand for, and what is the one hard rule?","answer":"Responsible, Accountable, Consulted, Informed. Exactly one A per task or decision.","source":"Standard responsibility-assignment matrix"},{"id":"gov-10","kind":"fact","prompt":"Dehghani's four principles of data mesh.","answer":"Domain-oriented ownership; data as a product; a self-serve data platform; federated computational governance.","why":"The governance principle: global standards are agreed jointly and enforced automatically by the platform, while domains own their data products.","source":"Zhamak Dehghani, Data Mesh (2022)"},{"id":"gov-11","kind":"concept","prompt":"Policy, standard, procedure, guideline: what does each layer of a governance document set say?","answer":"A policy states what must be true and why, at a level leadership approves and rarely changes. A standard makes it specific and checkable (naming rules, required metadata fields, retention periods). A procedure is the step-by-step how. A guideline is recommended practice, not mandatory.","points":["Policy: intent and mandate, approved by leadership, stable","Standard: specific, measurable requirements","Procedure: steps to comply","Guideline: advice, not mandatory","Keeping detail out of policy means the details can change without re-approval"],"source":"Common governance practice"},{"id":"gov-12","kind":"judgment","prompt":"Two departments define the same metric differently (say, 'active customer'), and each definition is right for its own purpose. What should governance do?","answer":"Don't force a single definition when the purposes really differ. Give each a distinct qualified name, document both in the glossary with an owner and a derivation, and say which one is authoritative for cross-organization reporting. Only push for convergence where a shared number is needed, and make sure every report states which definition it uses.","points":["Different purposes can justify different definitions","Disambiguate with distinct, qualified names","Document each with owner and derivation","Designate one as authoritative for shared reporting","Converge only where a shared number is needed; reports name their definition"],"source":"Synthesis: DMBOK2 ch. 3 and 12"}]},{"deck":"met","code":"MET","title":"Metadata & lineage","blurb":"What catalogs hold, how lineage gets extracted, where it breaks, and how to hold a tool to its claims.","cards":[{"id":"met-01","kind":"fact","prompt":"Glossary, dictionary or catalog: which one says what a business term means?","answer":"The business glossary.","why":"Dictionary: technical, field-level descriptions (names, types, allowed values). Catalog: a searchable inventory of data assets with owners, metadata and lineage, linking glossary terms to physical columns.","source":"DAMA-DMBOK2, ch. 12 (Metadata Management)"},{"id":"met-02","kind":"fact","prompt":"DMBOK's three kinds of metadata, plus an example of the one people forget.","answer":"Business, technical, operational. Operational is the forgotten one: job run times, refresh timestamps, row counts, error and access logs.","source":"DAMA-DMBOK2, ch. 12"},{"id":"met-03","kind":"concept","prompt":"Static (design-time) vs runtime lineage: how is each captured, and what does each miss?","answer":"Static lineage parses definitions (view and procedure code, ETL jobs, report queries) to infer dependencies. It covers paths that haven't run lately, but it misses anything built at runtime (dynamic SQL, parameterized connections) and can show paths that never execute. Runtime lineage records what actually ran (query logs, job events). It is accurate for those paths but only covers the observation window.","points":["Static = parse code/definitions; runtime = observe execution","Static misses runtime-built SQL and connections","Static can include dead paths","Runtime only covers what ran in the window"],"source":"General; see the OpenLineage docs for the runtime model"},{"id":"met-04","kind":"concept","prompt":"Why is lineage through stored procedures and ETL code hard to extract automatically? Give at least four reasons.","answer":"Dynamic SQL keeps object names in strings assembled at runtime. Temporary tables and variables hold intermediate steps that aren't catalog objects. Runtime DDL (SELECT INTO, CREATE during a run) makes objects that don't exist at parse time. Deferred name resolution lets code reference objects that don't exist yet. Synonyms, cross-database references, linked servers and views on views add indirection. Branches mean a static parser can't tell which path runs.","points":["Dynamic SQL hides names in strings","Temporary objects break the chain","Runtime DDL creates objects during execution","Deferred name resolution","Indirection: synonyms, cross-database and linked-server references","Control flow: static parsing can't know which branch runs"],"source":"General; vendor documentation on dependency tracking"},{"id":"met-05","kind":"concept","prompt":"Lineage from a BI tool back to the database often breaks at the seam, even when each connector works on its own. Why?","answer":"The two ends have to be stitched together by matching the source's identity. The server and database named in the BI tool (an alias, a fully qualified name, an IP, an instance name or port, a gateway) must match how the database connector registered that server. Native SQL embedded in reports also has to be parsed to know which tables it touches.","points":["Cross-system lineage is an identity-resolution problem between connectors","Name variants for the same server break the match","Embedded native queries need SQL parsing","Parameters and gateways can hide the real source"],"source":"General"},{"id":"met-06","kind":"fact","prompt":"Impact analysis vs root-cause analysis: which direction does each walk the lineage graph?","answer":"Impact analysis walks downstream: what breaks if I change this? Root-cause analysis walks upstream: where did this bad number come from?","source":"General"},{"id":"met-07","kind":"concept","prompt":"When is table-level lineage not enough?","answer":"When you need to know which source fields feed a specific column or measure. Examples: assessing a definition change to one field, tracing personal data, or chasing one bad number back through one transformed column. Table-level lineage shows that a dependency exists. Column-level lineage shows which fields are involved and through what transformation.","points":["Field-level change impact","Tracing personal or sensitive data","Debugging a single wrong metric","Table-level shows existence; column-level shows which fields and how"],"source":"General"},{"id":"met-08","kind":"fact","prompt":"What is OpenLineage, and what are its three core entities?","answer":"An open standard (LF AI & Data Foundation) for emitting runtime lineage events from pipelines. Its core entities are Job, Run and Dataset, extended through facets.","why":"Marquez is the reference backend. Airflow, Spark and dbt have integrations.","source":"openlineage.io"},{"id":"met-09","kind":"judgment","prompt":"A tool vendor says 'automated lineage is supported.' Write the acceptance criteria you'd put in the contract.","answer":"Name the exact sources, versions and deployment models in scope. Name the object types covered (tables, views, procedures, functions, ETL jobs, BI datasets and reports) and the granularity (table or column). Require end-to-end stitching across systems using your real server names. Supply a test fixture, a known chain with its expected graph, and have it demonstrated on your environment. Set the refresh cadence, what is automated versus manual, and the remedy if a criterion fails.","points":["Exact sources, versions, deployment models","Object types in scope","Granularity: table vs column","Cross-system stitching on your real names","A test fixture with expected graph, demonstrated on your data","Refresh cadence, manual vs automated, remedy on failure"],"source":"Synthesis"},{"id":"met-10","kind":"judgment","prompt":"You have a new data catalog and can't document everything. How do you choose what goes in first, and how will you know it's working?","answer":"Start from the high-stakes uses: core reporting, decisions with money attached, anything published. Catalog the assets that feed them in depth, with owners, CDE definitions and lineage. Go deep on a few assets rather than shallow on many. Measure use, not entries: searches, views, and questions answered without emailing someone. Iterate with the stewards and retire stale entries.","points":["Prioritize by use case and stakes, not by system","Depth on a few assets beats shallow coverage of many","Attach owners, definitions and lineage to what you load","Measure adoption: searches, views, questions answered, time to find data","Iterate with stewards; prune stale entries"],"source":"Synthesis"}]},{"deck":"mod","code":"MOD","title":"Data modeling & databases","blurb":"Normalization, keys, NULLs, indexes and loads on the database side; grain, facts and dimensions on the analytical side.","cards":[{"id":"mod-01","kind":"fact","prompt":"The one-line test for third normal form.","answer":"Every non-key attribute depends on the key, the whole key, and nothing but the key.","why":"'The key' is 1NF (rows identified by a key, no repeating groups). 'The whole key' is 2NF (no partial dependency on part of a composite key). 'Nothing but the key' is 3NF (no transitive dependency through another non-key attribute).","source":"William Kent, A Simple Guide to Five Normal Forms (1983)"},{"id":"mod-02","kind":"concept","prompt":"What problem does normalization solve? Name the three anomalies it prevents.","answer":"It stores each fact once, so the data can't contradict itself. It prevents update anomalies (changing a fact in one row but not its copies), insertion anomalies (being unable to record one fact without inventing another), and deletion anomalies (losing one fact when you delete a row about another).","points":["Each fact stored once; no self-contradiction","Update anomaly","Insertion anomaly","Deletion anomaly"],"source":"Codd (1970-72); standard database texts"},{"id":"mod-03","kind":"concept","prompt":"When is denormalizing the right call, and what does it cost?","answer":"In read-heavy analytical models, where data is loaded in batches and integrity is enforced by the load process rather than by each write. Star schemas deliberately denormalize dimensions. The cost is redundancy that the pipeline must keep consistent. Transactional systems that take many concurrent writes should stay normalized.","points":["Read-heavy, batch-loaded analytical workloads","Integrity moves to the load process","Cost: redundancy the pipeline must keep consistent","Keep write-heavy transactional systems normalized"],"source":"Kimball & Ross; standard database texts"},{"id":"mod-04","kind":"concept","prompt":"Surrogate vs natural keys: why do warehouses use meaningless surrogate keys?","answer":"Natural keys carry business meaning, so they change, get reused, and arrive formatted differently from different sources. A surrogate key is a stable, meaningless identifier that insulates the model from those changes and makes history tracking (Type 2 dimensions) possible. Keep the natural key as an attribute with a uniqueness rule so you can still look rows up by it.","points":["Natural keys change, get reused, vary across sources","Surrogates are stable and meaningless","Surrogates enable Type 2 history","Keep the natural key as a constrained attribute"],"source":"Kimball & Ross"},{"id":"mod-05","kind":"concept","prompt":"Why does `WHERE x NOT IN (SELECT y FROM t)` return no rows when one y is NULL?","answer":"SQL uses three-valued logic. Any comparison with NULL is UNKNOWN, not TRUE or FALSE. NOT IN expands to x <> y1 AND x <> y2 AND ..., and one UNKNOWN term makes the whole conjunction UNKNOWN or FALSE, never TRUE. WHERE keeps only TRUE rows. Use NOT EXISTS, or filter out the NULLs.","points":["Comparisons with NULL are UNKNOWN","WHERE keeps only TRUE","NOT IN is a chain of <> joined by AND","Use NOT EXISTS or exclude NULLs"],"source":"ISO SQL semantics; any SQL reference"},{"id":"mod-06","kind":"concept","prompt":"What does an index cost, and when does it fail to help?","answer":"Every insert, update and delete must maintain each index, and indexes take storage. An index helps selective predicates that touch a small fraction of rows. It rarely helps low-selectivity columns (a yes/no flag) or queries that read most of the table. For a composite index, column order matters: it serves queries that filter on its leading columns.","points":["Write and storage cost on every change","Helps selective predicates","Little help for low-selectivity columns or full scans","Composite indexes serve their leading columns"],"source":"Standard database texts"},{"id":"mod-07","kind":"concept","prompt":"What makes a data load idempotent, and why does it matter?","answer":"Running it twice produces the same result as running it once. Common patterns are replacing a whole partition or date range, or merging on keys instead of appending. It matters because loads fail and get retried: a rerun of an append-only load duplicates data, while an idempotent one can be retried safely.","points":["Same result whether run once or many times","Replace a partition/range, or merge on keys","Append-only reruns duplicate data","Makes retries and backfills safe"],"source":"Common data-engineering practice"},{"id":"mod-08","kind":"fact","prompt":"Kimball's four steps of dimensional design, in order.","answer":"1. Select the business process. 2. Declare the grain. 3. Identify the dimensions. 4. Identify the facts.","source":"Kimball & Ross, The Data Warehouse Toolkit, 3rd ed."},{"id":"mod-09","kind":"concept","prompt":"What does 'declare the grain' mean, and what goes wrong if you skip it?","answer":"State exactly what one fact row represents, for example one row per order line, or one row per ticket per status change. Skip it and grains get mixed in one table, which causes double counting and measures that are right only at some levels of aggregation.","points":["Grain = the business meaning of one row","Declared before dimensions and facts are chosen","Mixed grains lead to double counting and inconsistent measures"],"source":"Kimball & Ross"},{"id":"mod-10","kind":"fact","prompt":"An order moves through placed, paid, shipped and delivered, with one row per order whose milestone dates fill in over time. Which fact-table type?","answer":"Accumulating snapshot.","why":"Transaction: one row per event. Periodic snapshot: one row per period (inventory at month end). Accumulating snapshot: one row per process instance, updated as milestones occur. It's the natural home for durations between steps.","source":"Kimball & Ross"},{"id":"mod-11","kind":"fact","prompt":"Slowly changing dimension Types 1, 2 and 3, one line each.","answer":"Type 1: overwrite (no history). Type 2: add a new row with effective dates and a current flag (full history). Type 3: add a previous-value column (one step of history).","source":"Kimball & Ross"},{"id":"mod-12","kind":"concept","prompt":"What are a conformed dimension and a bus matrix, and why do they matter across teams?","answer":"A conformed dimension has the same keys and meaning everywhere it is used, such as one Customer, Date or Location dimension. That lets you drill across business processes. A bus matrix lists processes as rows and conformed dimensions as columns. It is the roadmap that keeps separately built models compatible.","points":["Same keys and meaning across fact tables","Enables drill-across between processes","Bus matrix = processes by shared dimensions, the integration plan"],"source":"Kimball & Ross"},{"id":"mod-13","kind":"concept","prompt":"Why do columnar analytical engines favor a star schema over one wide flat table or a deep snowflake?","answer":"Columnar storage compresses low-cardinality dimension columns well, and dimensions filter facts through simple one-to-many joins. A wide flat table repeats attributes on every row and invites inconsistent measures and grain errors. A deep snowflake adds join hops and confuses the people writing reports.","points":["Columnar compression favors low-cardinality dimension columns","Dimensions filter facts via one-to-many joins","Flat tables: repetition, grain errors, inconsistent measures","Snowflakes: extra hops and author confusion"],"source":"Kimball & Ross; BI vendor modeling guidance"},{"id":"mod-14","kind":"judgment","prompt":"A team wants 'one big flat table' so analysts can self-serve. What do you recommend, and how do you sell it?","answer":"Name the risks: mixed grains, double counting, and every report reinventing its measures. Offer a shared semantic model instead: a star schema with a few conformed dimensions and curated, documented measures. One certified model then feeds many reports. Teach people to build on that model rather than their own extracts. Sell it with a before-and-after on their own numbers, ideally a total that comes out differently today depending on who built the report.","points":["Name the risks: grain, double counting, inconsistent measures","Propose a shared semantic model (star, conformed dimensions, curated measures)","One certified model feeds many reports","Teach report building on the shared model","Persuade with their own numbers"],"source":"Synthesis"}]},{"deck":"lnk","code":"LNK","title":"Record linkage","blurb":"Fellegi-Sunter, blocking and thresholds: the math behind matching people, places and organizations across systems.","cards":[{"id":"lnk-01","kind":"fact","prompt":"Fellegi-Sunter: define the m- and u-probabilities for a field.","answer":"m = P(field agrees | the records are a true match). u = P(field agrees | the records are not a match).","source":"Fellegi & Sunter (1969)"},{"id":"lnk-02","kind":"concept","prompt":"How do m and u become a match weight, and how do the weights combine?","answer":"Agreement on a field adds log2(m/u). Disagreement adds log2((1-m)/(1-u)). Assuming conditional independence, the field weights and the prior log-odds sum to a total match weight in log2 odds. Convert to a probability with p = 2^w / (1 + 2^w).","points":["Agreement weight log2(m/u)","Disagreement weight log2((1-m)/(1-u))","Sum across fields plus prior (conditional independence)","Weight is log-odds; convert to probability"],"source":"Fellegi & Sunter (1969); Splink documentation"},{"id":"lnk-03","kind":"concept","prompt":"What does blocking do, and what is its main failure mode?","answer":"Blocking compares only the record pairs that share a blocking key (say, same postcode and first initial), which turns n-squared comparisons into something tractable. Its failure mode is that a true match with an error in the blocking field is never compared at all. The fix is several blocking rules whose results are unioned.","points":["Restricts comparisons to candidate pairs","Errors in the blocking field cause unrecoverable misses","Use several blocking rules, unioned"],"source":"Christen, Data Matching (2012)"},{"id":"lnk-04","kind":"concept","prompt":"Why should agreement on 'Zbigniewski' count for more than agreement on 'Smith'?","answer":"Because u depends on the value. Two random people are far more likely to share a common surname than a rare one. A term-frequency adjustment computes u from the frequency of that specific value, so agreement on a rare value counts as stronger evidence.","points":["u varies by value frequency","Rare-value agreement is stronger evidence","Term-frequency adjustment"],"source":"Splink documentation; Winkler"},{"id":"lnk-05","kind":"fact","prompt":"How are u-probabilities usually estimated, and why does that work?","answer":"By randomly sampling record pairs. Almost all random pairs are non-matches, so their agreement rate approximates u. m comes from EM within blocks or from labeled pairs.","source":"Splink documentation"},{"id":"lnk-06","kind":"judgment","prompt":"You are linking people between two organizations' client datasets to coordinate services. How do you set match thresholds?","answer":"Use two thresholds: auto-link above the upper one, reject below the lower one, and send the band between them to clerical review. Set them from what each error costs in this use. A false merge, which combines two people's histories, usually does more harm in service settings (wrong eligibility, privacy exposure) than a missed link. Estimate precision and recall on a labeled sample, size the review band to the staff who will work it, and monitor for drift.","points":["Two thresholds with a clerical-review band","Set from the asymmetric costs of false merges vs missed links","False merges usually worse in service contexts","Precision/recall on a labeled sample","Size the review band to capacity; monitor drift"],"source":"Synthesis"},{"id":"lnk-07","kind":"concept","prompt":"Why is an address string, on its own, a weak key for linking people?","answer":"Formats vary (St vs Street, unit designators, directionals). Many people share one address: households, multi-unit buildings, shelters. People move, so an address is only true for a period of time. PO boxes and institutional addresses add noise. Linking on address alone merges households into individuals.","points":["Format variation","Shared addresses (households, multi-unit, shelters)","Temporal: people move","Conflates households with individuals"],"source":"General"},{"id":"lnk-08","kind":"concept","prompt":"A new matching method raises the match rate from 82% to 95%. Why isn't that evidence it's better?","answer":"Match rate counts how many records got a match, not whether the matches are right. Loosening any matcher raises the rate by adding false matches. Judge it by precision and recall against a labeled sample, and report both alongside the rate.","points":["Match rate is not match accuracy","Looser matching inflates the rate with false matches","Measure precision and recall on labeled pairs","Report both, not the rate alone"],"source":"Christen, Data Matching (2012)"}]},{"deck":"prv","code":"PRV","title":"Privacy & disclosure","blurb":"Re-identification, suppression and noise: what to check before a table, map or dataset goes out.","cards":[{"id":"prv-01","kind":"fact","prompt":"Sweeney's classic re-identification finding: which three attributes uniquely identify about 87% of the US population?","answer":"5-digit ZIP code, gender, and full date of birth.","why":"The general lesson: a handful of ordinary attributes is enough to single people out, so 'no names' is not 'anonymous'.","source":"L. Sweeney, Simple Demographics Often Identify People Uniquely (2000)"},{"id":"prv-02","kind":"concept","prompt":"What is k-anonymity, and what attack does it fail against?","answer":"Each record is indistinguishable from at least k-1 others on its quasi-identifiers. It fails against homogeneity: if everyone in the group shares the same sensitive value, that value is disclosed anyway. l-diversity addresses this, and background-knowledge attacks also defeat k-anonymity.","points":["Indistinguishable from k-1 others on quasi-identifiers","Homogeneity attack","Background knowledge attack","l-diversity as the fix for homogeneity"],"source":"Sweeney (2002); Machanavajjhala et al. (2007)"},{"id":"prv-03","kind":"concept","prompt":"You suppress one small cell in a published table but keep the row and column totals. What's the problem?","answer":"The hidden value can be recovered by subtracting from the totals. You need complementary (secondary) suppression of other cells, or rounding or perturbation, so that no hidden cell can be derived.","points":["Recoverable by subtraction from margins","Complementary suppression","Or rounding/perturbation"],"source":"Federal Committee on Statistical Methodology, Statistical Policy Working Paper 22"},{"id":"prv-04","kind":"concept","prompt":"Differential privacy in two sentences: what is guaranteed, and what does epsilon control?","answer":"Adding or removing any one person changes the probability of any output by at most a factor of e^epsilon, so results reveal little about any individual. A smaller epsilon means more noise and more privacy, and every query spends from a finite privacy-loss budget.","points":["One person's presence changes output probabilities by at most e^epsilon","Smaller epsilon = more noise, more privacy","Composition: queries spend a finite budget"],"source":"Dwork & Roth, The Algorithmic Foundations of Differential Privacy (2014)"},{"id":"prv-05","kind":"concept","prompt":"What is the mosaic effect, and how does it change how you review a data release?","answer":"Releases that are each harmless can be combined, with each other or with outside data, to identify people. So you assess a release against everything already published and plausibly available, not in isolation, and you track what has gone out before.","points":["Individually safe releases can combine into disclosure","Outside data counts too","Review cumulatively, not release by release","Keep a record of what has been published"],"source":"US OMB M-13-13 (Open Data Policy); disclosure-control literature"},{"id":"prv-06","kind":"fact","prompt":"Data minimization and purpose limitation: state each in one line.","answer":"Minimization: collect and keep only the data needed for a stated purpose. Purpose limitation: don't reuse data for purposes incompatible with the one it was collected for.","why":"Both appear in the Fair Information Practice Principles and in GDPR Article 5. Data you never collected can't leak.","source":"FIPPs; GDPR Art. 5(1)(b)-(c)"},{"id":"prv-07","kind":"judgment","prompt":"A team wants to publish a map of individual service requests at their exact addresses. What risks do you raise, and what do you propose?","answer":"Exact points at single-household addresses identify households, and some request types are sensitive: welfare checks, possible domestic or mental-health situations, complaints about a neighbor. The person who complained can often be inferred. Propose aggregating to a street segment, block or larger area, or snapping points to the block. Suppress small counts and exclude sensitive request types. Get legal or privacy review, and publish documentation explaining the protections.","points":["Household identification at single-household addresses","Sensitive request types","Requester inference","Aggregate or snap locations; suppress small counts; exclude sensitive types","Privacy/legal review and documented protections"],"source":"Synthesis"}]},{"deck":"evd","code":"EVD","title":"Evidence & measurement","blurb":"The traps that wreck analytics: selection, small numbers, shifting mixes, broken series, proxies and measures that become targets.","cards":[{"id":"evd-01","kind":"concept","prompt":"An intervention targets the 10 sites with the most incidents last quarter, and incidents drop the next quarter. Why isn't that evidence it worked?","answer":"Regression to the mean. Sites picked because they had an extreme period tend to look more typical the next period whether or not anything was done. You need a comparison group selected the same way, or longer pre-intervention trends.","points":["Selection on an extreme value","Regression to the mean happens without any intervention","Comparison group chosen the same way, or longer pre-trends"],"source":"Standard; see Campbell & Ross (1968) on the Connecticut speeding crackdown"},{"id":"evd-02","kind":"fact","prompt":"State Campbell's law.","answer":"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor.","why":"Close relative of Goodhart's law (popular form, after Strathern): when a measure becomes a target, it ceases to be a good measure.","source":"Donald T. Campbell, Assessing the Impact of Planned Social Change (1979)"},{"id":"evd-03","kind":"fact","prompt":"What is the identifying assumption of difference-in-differences?","answer":"Parallel trends: absent the treatment, the treated and comparison groups would have changed by the same amount.","why":"Check the pre-period trends, and look for anything else that changed at the same time.","source":"Standard econometrics"},{"id":"evd-04","kind":"concept","prompt":"Why do 'top 10 by rate' rankings of branches, schools or neighborhoods keep featuring the smallest ones, and what do you do about it?","answer":"Small denominators make rates noisy, so by chance small units fill both the top and the bottom of the ranking. Use funnel plots, empirical-Bayes shrinkage toward the overall rate, minimum denominators, or pooled years, and show the uncertainty.","points":["Small denominators produce extreme rates in both directions","Funnel plots or shrinkage","Minimum denominators or pooled years","Show uncertainty"],"source":"Gelman & Price, All maps of parameter estimates are misleading (1999)"},{"id":"evd-05","kind":"judgment","prompt":"An executive asks for 'the 10 worst locations for complaints' from raw counts. What do you ask and adjust before you send a list?","answer":"Normalize by an exposure measure (customers, units, visits) rather than using raw counts. Raise detection bias: complaints reflect who complains and where staff look, not only where problems are. Small numbers make rankings unstable, so pool time or shrink the rates. Pin down the time window and which complaints count (type, severity, open or closed). Ask what decision the list is for, and present it with uncertainty and context.","points":["Normalize by exposure","Detection and reporting bias","Small-number instability","Define the window and the categories","Ask what decision it informs; show uncertainty"],"source":"Synthesis"},{"id":"evd-06","kind":"concept","prompt":"Average resolution time improved in every region, yet the organization-wide average got worse. How?","answer":"Simpson's paradox. The mix shifted: more cases now come from regions or case types with long resolution times, so the weighted average rises even though every subgroup improved. Report stratified figures or standardize the mix.","points":["Composition shift between subgroups","Weighted average can move against every subgroup","Stratify or standardize"],"source":"Standard"},{"id":"evd-07","kind":"concept","prompt":"Inspections, complaints and enforcement records all count something. What do they actually measure, and what follows?","answer":"They record the organization's process: where it looked, who reported, what staff chose to write down. That mixes the underlying problem with effort and reporting behavior. More inspectors or an easier complaint channel raise counts with no change in the problem. Model or at least report effort alongside the counts, and be wary of comparing areas with different detection.","points":["Administrative data measures the process, not just the phenomenon","Counts move with effort and reporting behavior","Report effort alongside counts","Detection differences confound comparisons"],"source":"Standard measurement practice"},{"id":"evd-08","kind":"concept","prompt":"A metric's definition, source system or coverage changes partway through a time series. What do you do?","answer":"Treat it as a break in the series, not a trend. Mark the break on every chart, run old and new methods in parallel for an overlap period if you can, and either bridge (back-cast) with the overlap or report the two segments separately.","why":"Example: US national crime statistics broke in 2021 when the FBI moved to an incident-based system and many agencies hadn't converted.","points":["A method change is a break, not a trend","Annotate the break","Parallel run for an overlap period","Bridge with the overlap, or report segments separately"],"source":"Standard statistical practice"},{"id":"evd-09","kind":"fact","prompt":"Two estimates have overlapping 95% confidence intervals. Does that mean the difference isn't significant?","answer":"No. Test the difference itself. For independent estimates its standard error is sqrt(SE1² + SE2²), which is smaller than SE1 + SE2, so intervals can overlap while the difference is still significant.","source":"Schenker & Gentleman, On judging the significance of differences by examining the overlap between confidence intervals (2001)"},{"id":"evd-10","kind":"concept","prompt":"A field classifies records for one administrative purpose, such as a land-use code for tax assessment. Why is it risky to use it to count a real-world state, like vacant buildings?","answer":"The code answers the question its process asks, not yours. An abandoned house usually keeps its residential code, and codes lag reality. Treat it as a proxy, look for direct signals of the state you care about, validate the proxy against ground truth, and define the target state explicitly.","points":["Codes answer their own process's question","Classification lags and diverges from reality","Seek direct signals; triangulate sources","Validate the proxy against ground truth","Define the target state explicitly"],"source":"Standard measurement practice"}]},{"deck":"chg","code":"CHG","title":"Change management","blurb":"Models for why change stalls and what moves it: urgency, transitions, adoption curves, defaults and resistance.","cards":[{"id":"chg-01","kind":"fact","prompt":"Lewin's three-stage model of change.","answer":"Unfreeze, change, refreeze.","why":"Unfreezing (making the case that the current state can't continue) is the stage most often skipped. Refreezing is what keeps a change from sliding back.","source":"Kurt Lewin (1947)"},{"id":"chg-02","kind":"concept","prompt":"Bridges distinguishes change from transition. What's the difference, and what are the three phases of a transition?","answer":"Change is the external event: the new system, structure or rule. Transition is the psychological process people go through to come to terms with it. Its phases are endings (letting go of the old way and identity), the neutral zone (an in-between period of confusion that is also when new patterns can form), and new beginnings. Leaders tend to plan the change and neglect the endings.","points":["Change = situational; transition = psychological","Endings: letting go comes first","Neutral zone: confusion, but also creativity","New beginnings","Leaders under-manage endings"],"source":"William Bridges, Managing Transitions (1991)"},{"id":"chg-03","kind":"fact","prompt":"In Kotter's model, what is step one, and what did he call the most common reason transformations fail?","answer":"Establish a sense of urgency. The most common error is not establishing enough of it: allowing too much complacency.","why":"The eight steps: urgency; guiding coalition; vision and strategy; communicate the vision; empower broad action; short-term wins; consolidate gains; anchor in the culture.","source":"John Kotter, Leading Change: Why Transformation Efforts Fail (HBR, 1995)"},{"id":"chg-04","kind":"concept","prompt":"Why does Kotter insist on planned short-term wins, and what makes a win count?","answer":"Long efforts lose momentum and give skeptics ammunition. Visible wins show that the sacrifice is paying off, reward the people driving the change, undermine cynics, and keep sponsors on board. To count, a win must be visible, unambiguous, and clearly tied to the change, and it has to be planned rather than hoped for.","points":["Sustains momentum and sponsor support","Rewards change agents; undercuts cynics","Visible, unambiguous, tied to the change","Planned, not hoped for"],"source":"Kotter, Leading Change (1996)"},{"id":"chg-05","kind":"fact","prompt":"Prosci's ADKAR: the five elements, in order.","answer":"Awareness, Desire, Knowledge, Ability, Reinforcement.","why":"As a diagnostic, find the first element that is missing. Training (Knowledge, Ability) fails if Awareness or Desire is absent.","source":"Jeff Hiatt, ADKAR (2006)"},{"id":"chg-06","kind":"fact","prompt":"Rogers' adopter categories, with their shares.","answer":"Innovators 2.5%, early adopters 13.5%, early majority 34%, late majority 34%, laggards 16%.","why":"Early adopters are the opinion leaders the early majority watches. Recruit them before trying to convince everyone.","source":"Everett Rogers, Diffusion of Innovations"},{"id":"chg-07","kind":"fact","prompt":"The Heaths' three-part framework for change in Switch.","answer":"Direct the Rider (the rational side: give clear direction), motivate the Elephant (the emotional side: make people feel it), and shape the Path (change the environment so the behavior is easier).","source":"Chip & Dan Heath, Switch (2010)"},{"id":"chg-08","kind":"concept","prompt":"Why is changing the default often more effective than persuasion?","answer":"People disproportionately stay with whatever happens if they do nothing (status quo bias, inertia, an implied endorsement). Making the desired behavior the default, with an easy opt-out, changes behavior far more than information campaigns do. The classic evidence is automatic enrollment in retirement savings plans, which sharply raised participation among new hires.","points":["Status quo bias and inertia","Defaults signal an implied recommendation","Opt-out defaults beat persuasion","Evidence: automatic retirement-plan enrollment"],"source":"Madrian & Shea, The Power of Suggestion (QJE, 2001); Thaler & Sunstein, Nudge (2008)"},{"id":"chg-09","kind":"judgment","prompt":"You're rolling out a new standard that teams didn't ask for, and a respected team lead is openly resisting. What do you do?","answer":"Treat the resistance as information: find out what it protects, whether that's workload, a real flaw, or a loss of control or status. Involve the resister in shaping the rollout. Lower the cost of adoption through templates, defaults and help. Start with willing early adopters and a visible win. Separate can't (knowledge, ability) from won't (desire), because they need different responses. Reinforce and recognize the people who adopt it.","points":["Resistance as information: what does it protect?","Involve resisters in design","Reduce adoption cost (templates, defaults, help)","Early adopters and a visible win first","Diagnose can't vs won't","Reinforce and recognize adoption"],"source":"Synthesis: ADKAR; Rogers; Heath & Heath"}]},{"deck":"lrn","code":"LRN","title":"Learning & capability building","blurb":"How adults build skill, why training usually doesn't change behavior, and how to design it so it does.","cards":[{"id":"lrn-01","kind":"fact","prompt":"Kirkpatrick's four levels of training evaluation, in order.","answer":"1. Reaction. 2. Learning. 3. Behavior. 4. Results.","why":"Most programs stop at level 1 (did they like it?). Level 3 (are they doing it on the job?) is where skills training succeeds or fails.","source":"Kirkpatrick & Kirkpatrick, Four Levels of Training Evaluation (2016)"},{"id":"lrn-02","kind":"concept","prompt":"What are 'desirable difficulties', and what trap do they create when you evaluate training?","answer":"Spacing, interleaving, retrieval practice and generation make practice feel harder and look worse in the moment, but they improve long-term retention and transfer. The trap is that performance during training is not learning, so smooth, easy sessions get good reviews and teach less.","points":["Spacing, interleaving, retrieval, generation","Feel harder and look worse in the moment","Better long-term retention and transfer","In-session performance and satisfaction are poor proxies for learning"],"source":"Bjork & Bjork (2011); Soderstrom & Bjork (2015)"},{"id":"lrn-03","kind":"fact","prompt":"The Dreyfus model's five stages of skill acquisition, and what novices need compared with experts.","answer":"Novice, advanced beginner, competent, proficient, expert. Novices need explicit, context-free rules and checklists. Experts act from intuition built on many cases, so rules slow them down. Teach each stage differently.","source":"Dreyfus & Dreyfus (1980); Mind over Machine (1986)"},{"id":"lrn-04","kind":"concept","prompt":"The worked-example effect: what is it, and when does it reverse?","answer":"For novices, studying worked examples teaches more than solving the same problems unaided, because problem solving uses up working memory on search rather than on learning the structure. As learners gain expertise the benefit fades and can reverse (the expertise reversal effect), so fade the examples into independent practice.","points":["Novices learn more from studying worked examples","Problem solving overloads working memory with search","Expertise reversal: the benefit fades with skill","Fade from examples to independent practice"],"source":"Sweller, cognitive load theory; Kalyuga et al. (2003)"},{"id":"lrn-05","kind":"concept","prompt":"What is the curse of knowledge, and what is the classic demonstration?","answer":"Once you know something, it is hard to imagine not knowing it, so experts skip steps and overestimate how clear they are. In Elizabeth Newton's tapping study, people who tapped out well-known songs predicted listeners would name about half of them. Listeners named about 1 in 40. Fix it by testing explanations on real novices and leading with concrete examples.","points":["Experts can't simulate not knowing","Tappers predicted ~50%; listeners got ~2.5%","Explanations skip steps","Test on novices; lead with concrete examples"],"source":"Elizabeth Newton, Stanford dissertation (1990); Heath & Heath, Made to Stick (2007)"},{"id":"lrn-06","kind":"concept","prompt":"What is the illusion of explanatory depth, and how do you use it when interviewing people about a process?","answer":"People believe they understand how something works in far more detail than they do. Asking them to explain the mechanism step by step exposes the gaps. Ask 'Walk me through how this number gets produced, from intake to report' rather than 'Do you understand the process?'","points":["Overestimated understanding of mechanisms","Step-by-step explanation reveals gaps","Interview with walk-throughs, not yes/no comprehension checks"],"source":"Rozenblit & Keil, The misunderstood limits of folk science (2002)"},{"id":"lrn-07","kind":"fact","prompt":"Wenger's three structural elements of a community of practice.","answer":"Domain (the shared area of concern), community (the people and their relationships), and practice (the shared repertoire of tools, methods and stories).","source":"Wenger, McDermott & Snyder, Cultivating Communities of Practice (2002)"},{"id":"lrn-08","kind":"judgment","prompt":"Design a tools training that changes what people do on the job, not just what they know.","answer":"Build it on their real tasks and their own data. Run short sessions spaced over weeks, with participants building and retrieving rather than watching demos. Interleave skills, and give an on-the-job assignment between sessions. Back it with office hours and a network of champions. Measure behavior (Kirkpatrick level 3): are they using the shared, approved assets, and is their work being reused?","points":["Real tasks and real data","Spaced short sessions; building and retrieval over demos","On-the-job assignments between sessions","Office hours and champions for follow-through","Measure level 3 behavior"],"source":"Synthesis: Kirkpatrick; Bjork"}]},{"deck":"ldr","code":"LDR","title":"Leadership","blurb":"Influence, decisions, feedback and teams: principles for leading work you don't fully control.","cards":[{"id":"ldr-01","kind":"concept","prompt":"What is psychological safety, and what is it not?","answer":"A shared belief that the team is safe for interpersonal risk-taking: asking questions, admitting mistakes, raising concerns. It is not niceness, comfort or lowered standards. Edmondson pairs it with accountability: high safety plus high standards is the learning zone, and high safety with low standards is just comfort.","points":["Shared belief that interpersonal risk is safe","Not niceness or lowered standards","Safety plus accountability = learning zone","Safety without standards = comfort zone"],"source":"Amy Edmondson (1999); The Fearless Organization (2018)"},{"id":"ldr-02","kind":"concept","prompt":"Heifetz distinguishes technical problems from adaptive challenges. What's the difference, and what's the classic leadership failure?","answer":"A technical problem has a known solution that an expert or authority can implement. An adaptive challenge requires the people who have the problem to learn and change their values, habits or loyalties, so no one can solve it for them. The classic failure is treating an adaptive challenge as a technical one, such as buying a tool to fix a culture problem.","points":["Technical: known solution, expert can apply it","Adaptive: the people with the problem must change","Authority can't solve adaptive challenges by itself","Failure: applying technical fixes to adaptive problems"],"source":"Ronald Heifetz, Leadership Without Easy Answers (1994)"},{"id":"ldr-03","kind":"concept","prompt":"Cohen and Bradford's model of influence without authority: how does it work?","answer":"Treat the other person as a potential ally. Clarify what you need, then understand their world: their pressures, goals and what they value, their 'currencies'. Influence comes from exchange: offer what they value (help, information, recognition, access) in return for what you need, and build the relationship so the exchanges continue.","points":["Assume a potential ally","Clarify your goals","Diagnose their world and currencies","Exchange what they value for what you need","Invest in the relationship"],"source":"Cohen & Bradford, Influence Without Authority (1990)"},{"id":"ldr-04","kind":"fact","prompt":"Situational leadership: the four styles, and what decides which to use.","answer":"Directing, coaching, supporting, delegating. The choice depends on the person's development level on that specific task: their competence and commitment, not their seniority.","why":"The same person can need directing on a new task and delegating on a familiar one.","source":"Hersey & Blanchard; Blanchard, SLII"},{"id":"ldr-05","kind":"fact","prompt":"The SBI feedback model.","answer":"Situation, Behavior, Impact. Name when and where, describe the observable behavior (not character or intent), and say what effect it had. Then ask for their view.","source":"Center for Creative Leadership"},{"id":"ldr-06","kind":"fact","prompt":"Bain's RAPID decision roles.","answer":"Recommend, Agree, Perform, Input, Decide. Exactly one person holds the D.","why":"Most decision gridlock comes from unclear D, or from too many people who believe they hold an A (a veto).","source":"Rogers & Blenko, Who Has the D? (HBR, 2006)"},{"id":"ldr-07","kind":"fact","prompt":"Tuckman's stages of team development.","answer":"Forming, storming, norming, performing, plus adjourning, added in 1977.","why":"Storming is normal, not a sign the team is failing. A team skips it only by suppressing conflict.","source":"Tuckman (1965); Tuckman & Jensen (1977)"},{"id":"ldr-08","kind":"concept","prompt":"What is Chesterton's fence, and how does it apply to legacy rules and systems?","answer":"Don't remove a fence until you know why it was put up. With an odd validation rule, a manual step or a strange table, find out what problem it solved. Then decide: the reason may be gone, or the fence may be holding up something you can't see.","points":["Understand why before removing","Legacy oddities often encode past failures","The reason may have expired, or may still hold","Then decide deliberately"],"source":"G. K. Chesterton, The Thing (1929)"},{"id":"ldr-09","kind":"concept","prompt":"'Disagree and commit': what does it require of you before and after the decision?","answer":"Before: state your disagreement fully and clearly while the decision is still open. After: commit to making the decision succeed. No relitigating, no quiet foot-dragging, no 'I told you so'. Reopen it only with new information, through the channel that made it.","points":["Voice disagreement fully before the decision","Then commit to making it work","No relitigating or passive resistance","Reopen only with new information"],"source":"Intel management practice (Andy Grove); Bezos, 2016 shareholder letter"},{"id":"ldr-10","kind":"judgment","prompt":"Your sponsor wants a visible win in 90 days, but the foundational work will take a year. How do you handle it?","answer":"Don't choose between them. Pick a thin end-to-end slice on a high-visibility use case that also delivers one reusable piece of the foundation. Make foundation progress visible with a few honest metrics. Set expectations explicitly with a roadmap that shows what the win does and doesn't prove. Avoid one-off hacks that create debt, and raise risks early rather than at the deadline.","points":["A thin end-to-end slice that also builds foundation","Choose a high-visibility use case","Make foundation progress visible","Explicit roadmap and expectations","Avoid one-off hacks; surface risks early"],"source":"Synthesis: Kotter (short-term wins); product practice"}]}];
const BUILD = "2026-11-06-6a893e2edd";
const INBOX = { deck: "inb", code: "INB", title: "Inbox", blurb: "Cards you added, or accepted from Claude.", cards: [] };
const DECK_META = new Map([...DECKS, INBOX].map((d) => [d.deck, d]));
// Role-level only: cards and explanations stay general, never tied to one organization.
const LEARNER =
  "an experienced data leader whose work spans data governance, metadata, data modeling and databases, analytics, " +
  "change management, capability building and leadership. Economist by training. " +
  "Wants terse, precise, non-sycophantic explanations; skip basics they already know.";
const LS_KEY = "card-catalog:v1";
const RATING = { 1: "Again", 2: "Hard", 3: "Good", 4: "Easy" };
const VIEWS = ["review", "catalog", "add", "patterns", "tuning"];
const VIEW_LABEL = { review: "Review", catalog: "Catalog", add: "Add", patterns: "Patterns", tuning: "Tuning" };

const S = {
  mode: "loading", // loading | db | local | unreachable
  db: null, sample: null, downloads: null, claudeOff: false,
  config: mergeConfig(null), sched: null,
  cards: [], byId: new Map(),
  mem: new Map(), logs: new Map(), expl: new Map(), custom: new Map(), flags: [], insights: null,
  view: "review", session: null, unsaved: false,
  cat: { deck: null, q: "", open: null, flagFor: null },
  add: { note: "", deck: "inb", drafts: [], busy: false, err: "", manual: { kind: "fact", prompt: "", answer: "", points: "" } },
  pat: { busy: false, err: "", topic: "" },

};

// ---------- small utilities ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
const pct = (x) => (x == null || Number.isNaN(x) ? "–" : `${Math.round(x * 100)}%`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.floor(Math.random() * 1296).toString(36).padStart(2, "0")}`;
const clone = (x) => (x == null ? x : structuredClone(x));
function withTimeout(p, ms = 10000) {
  let t;
  return Promise.race([p, new Promise((_, rej) => (t = setTimeout(() => rej({ code: "timeout" }), ms)))]).finally(() => clearTimeout(t));
}
const deckCode = (deck) => DECK_META.get(deck)?.code || deck.toUpperCase();
const callNumber = (c) => (c.custom && !/^[a-z]{3}-\d+$/.test(c.id) ? `${deckCode(c.deck)}·${c.id.slice(-4).toUpperCase()}` : c.id.toUpperCase().replace("-", "·"));
const roll = () => S.config.rolloverHour;
const today = () => dayKey(Date.now(), roll());

let toastTimer;
function toast(msg, action) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" id="toast-act">${esc(action.label)}</button>` : ""}`;
  el.hidden = false;
  if (action) document.getElementById("toast-act").onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), action ? 6000 : 3000);
}

// ---------- persistence ----------
const pendingW = new Map();
const inflightW = new Set();
function persist(path, data) {
  if (S.mode === "db") {
    pendingW.set(path, clone(data));
    if (!inflightW.has(path)) drain(path);
  } else if (S.mode === "local") saveLocalSoon();
}
async function drain(path) {
  inflightW.add(path);
  while (pendingW.has(path)) {
    const data = pendingW.get(path);
    pendingW.delete(path);
    try {
      await S.db.doc(path).set(data);
    } catch (e) {
      if (e?.code === "unavailable") {
        await sleep(800 + Math.random() * 1200);
        try { await S.db.doc(path).set(data); continue; } catch (e2) { writeFailed(e2); continue; }
      }
      writeFailed(e);
    }
  }
  inflightW.delete(path);
}
function writeFailed(e) {
  S.unsaved = true;
  toast(e?.code === "quota_exceeded"
    ? "Storage is full. Export your data from Tuning, then resolve old flags."
    : "A change didn't save. It's still on this screen; export from Tuning before closing.");
  renderStatus();
}
let localTimer;
function saveLocalSoon() {
  clearTimeout(localTimer);
  localTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        mem: [...S.mem], logs: [...S.logs], expl: [...S.expl], custom: [...S.custom], flags: S.flags, config: S.config, insights: S.insights,
      }));
    } catch { S.unsaved = true; renderStatus(); }
  }, 250);
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S.mem = new Map(d.mem || []); S.logs = new Map(d.logs || []); S.expl = new Map(d.expl || []);
    S.custom = new Map(d.custom || []); S.flags = d.flags || []; S.config = mergeConfig(d.config); S.insights = d.insights || null;
  } catch { /* private window or blocked storage: start empty */ }
}
async function loadDb() {
  const col = async (name) => (await withTimeout(S.db.collection(name).get())).docs;
  const [cards, reviews, expl, custom, flags, cfg, ins] = await Promise.all([
    col("cards"), col("reviews"), col("explanations"), col("custom"), col("flags"),
    withTimeout(S.db.doc("config/scheduler").get()), withTimeout(S.db.doc("insights/latest").get()),
  ]);
  S.mem = new Map(cards.map((d) => [d.id, clone(d.data())]));
  S.logs = new Map(reviews.map((d) => [d.id, clone(d.data().items || [])]));
  S.expl = new Map(expl.map((d) => [d.id, clone(d.data())]));
  S.custom = new Map(custom.map((d) => [d.id, clone(d.data())]));
  S.flags = flags.map((d) => ({ id: d.id, ...clone(d.data()) }));
  S.config = mergeConfig(cfg.exists ? clone(cfg.data()) : null);
  S.insights = ins.exists ? clone(ins.data()) : null;
}

function assembleCards() {
  const map = new Map();
  for (const d of DECKS) for (const c of d.cards) map.set(c.id, { ...c, deck: d.deck });
  for (const [id, cu] of S.custom) {
    if (cu.deleted) { map.delete(id); continue; }
    const base = map.get(id);
    map.set(id, { ...(base || {}), ...cu, id, deck: cu.deck || base?.deck || "inb", custom: !base, edited: !!base });
  }
  S.cards = [...map.values()];
  S.byId = map;
}

// ---------- Claude ----------
function claudeReady() { return !!S.sample && !S.claudeOff; }
function sampleError(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      S.claudeOff = true;
      return "Claude isn't available on this page right now, so grade yourself.";
    case "rate_limited": return "Too many Claude requests just now. Try again in a minute.";
    case "session_expired": return "Sign in to Claude again, then retry.";
    case "invalid_json": return "Claude's reply didn't parse. Try again.";
    case "refused": return "Claude declined this one.";
    case "prompt_too_large": return "Too much text for one request. Shorten it.";
    case "cancelled": return "";
    default: return "Couldn't reach Claude. Try again.";
  }
}
async function ask(key, prompt, opts = {}) {
  S.busy.add(key); S.errs.delete(key); render();
  const t = performance.now();
  try {
    return await S.sample.json(prompt, { modelTier: "default", ...opts });
  } catch (e) {
    const msg = sampleError(e);
    if (msg) S.errs.set(key, msg);
    return null;
  } finally {
    S.busy.delete(key);
    if (S.session?.current && key.endsWith(S.session.current)) S.session.waitMs += performance.now() - t;
    render();
  }
}
function attemptsFor(id) {
  const out = [];
  for (const [day, items] of S.logs) for (const l of items) if (l.c === id) out.push({ day, ...l });
  return out.sort((a, b) => a.t - b.t);
}
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
function cardBlock(c) {
  return `CARD (${c.kind}, deck "${DECK_META.get(c.deck)?.title || c.deck}"): ${c.prompt}\nREFERENCE ANSWER: ${c.answer}` +
    (c.points?.length ? `\nKEY POINTS:\n${c.points.map((p, i) => `${i + 1}. ${p}`).join("\n")}` : "") +
    (c.why ? `\nNOTE: ${c.why}` : "");
}
function gradePrompt(c, typed) {
  return `Grade one spaced-repetition answer. The learner is ${LEARNER}
Grade substance, not wording. Be strict but fair. Partial credit is allowed.

${cardBlock(c)}

LEARNER'S ANSWER:
"""${typed}"""

Rating scale: 1 = missed the core idea or stated something false; 2 = core idea present but important points missing or shaky; 3 = core idea and most points; 4 = complete and precise.
Reply with only JSON:
{"points":[{"i":1,"verdict":"hit|partial|miss","note":"at most 12 words"}],"wrong":"a false claim in their answer, or empty string","feedback":"at most 50 words, second person, no praise padding","rating":3}
Include one entry in "points" per key point${c.points?.length ? "" : " (treat the reference answer as a single point)"}.`;
}
function explainPrompt(c, attempts) {
  const tries = attempts.map((a) => `- ${a.day}, rated ${RATING[a.r]}${a.g ? ` (grader suggested ${RATING[a.g]})` : ""}: ${a.a ? `"${clip(a.a, 500)}"` : "(answered in their head; no typed answer)"}`).join("\n");
  const near = S.cards.filter((x) => x.deck === c.deck && x.id !== c.id && !x.retired).slice(0, 8)
    .map((x) => `- ${x.id}: ${clip(x.prompt, 140)} => ${clip(x.answer, 160)}`).join("\n");
  return `A learner keeps missing this spaced-repetition card. Find the specific misconception behind their attempts and fix it.
Learner: ${LEARNER}

${cardBlock(c)}

THEIR ATTEMPTS (oldest first):
${tries || "- none recorded"}

OTHER CARDS IN THE SAME DECK (look for interference or confusable pairs):
${near || "- none"}

Write for someone who knows the field. No definitions of basics, no pep talk. Keep it general: no specific organizations, places, vendors or products unless the card is about one. If attempts have no typed text, infer the likely confusion from the card and its neighbours and say that you are inferring.
Reply with only JSON:
{"diagnosis":"1-2 sentences: what they get wrong and why it is tempting","explanation":"at most 120 words","hook":"one memorable handle: a sharp contrast, a concrete workplace example, or a mnemonic","contrast_card":{"prompt":"...","answer":"..."},"rewrite":null}
Set "contrast_card" to null unless a discrimination card would help. Set "rewrite" to {"prompt","answer"} only if the card itself is ambiguous or overloaded.`;
}
function patternsPrompt(missed) {
  const body = missed.map(({ c, m, tries }) =>
    `[${c.id}] deck=${c.deck} kind=${c.kind} agains=${m.agains} lapses=${m.lapses}\nQ: ${clip(c.prompt, 220)}\nA: ${clip(c.answer, 260)}\nTheir attempts: ${tries.filter((t) => t.r <= 2).map((t) => (t.a ? `"${clip(t.a, 160)}"` : "(untyped)")).slice(-3).join(" | ") || "(untyped)"}`).join("\n\n");
  return `Here is a learner's miss history in a spaced-repetition collection. Look for patterns across cards, not card-by-card fixes.
Learner: ${LEARNER}
Deck keys: ${[...DECK_META.values()].map((d) => `${d.deck}=${d.title}`).join("; ")}

MISSED CARDS:
${body}

At most 4 patterns and 5 new cards. Concept and judgment cards need 2-5 points.`;

function draftPrompt(note) {
  return `Turn this note into spaced-repetition cards for the learner.
Learner: ${LEARNER}
Rules: each card tests one idea; the prompt is precise and has one consistent answer; no yes/no prompts; prefer why/how/when over bare what when the note supports it. Use only what the note states or directly implies. Add no outside facts.
Make every card broadly applicable: extract the transferable principle, and leave out the names of the organization, its people, departments, systems, vendors and places. A card should make sense to a data professional anywhere.
Kinds: "fact" (short recall), "concept" (explain in a few sentences; give 2-5 points), "judgment" (a realistic scenario needing a decision; give 3-5 points).

NOTE:
"""${note}"""

Reply with only JSON: {"cards":[{"kind":"fact","prompt":"...","answer":"...","points":[]}]}
At most 5 cards. If nothing in the note is worth remembering, reply {"cards":[]}.`;
}
const str = (x, n = 2000) => (typeof x === "string" ? x.slice(0, n) : "");
function cleanCard(x) {
  if (!x || typeof x !== "object") return null;
  const kind = ["fact", "concept", "judgment"].includes(x.kind) ? x.kind : "fact";
  const prompt = str(x.prompt, 400).trim(), answer = str(x.answer, 1500).trim();
  if (!prompt || !answer) return null;
  const points = Array.isArray(x.points) ? x.points.map((p) => str(p, 200).trim()).filter(Boolean).slice(0, 6) : [];
  return { kind, prompt, answer, points, deck: DECK_META.has(x.deck) ? x.deck : undefined };
}

function todayCounts() {
  const items = S.logs.get(today()) || [];

}
function startSession() {
  const now = Date.now();
  const q = buildQueue({ cards: S.cards, mem: S.mem, now, config: S.config, today: todayCounts(), sched: S.sched });
  S.session = { queue: q.queue, counts: q.counts, lastId: null, current: null, reviewed: 0, passed: 0, undo: null };
  advance(false);
}
function advance(doRender = true) {
  const sess = S.session;
  const nx = nextCard({ queue: sess.queue, cards: S.cards, mem: S.mem, now: Date.now(), lastId: sess.lastId });
  Object.assign(sess, { current: nx?.id || null, from: nx?.from, phase: "front", typed: "", grade: null, typing: false, t0: performance.now(), waitMs: 0, hiddenMs: 0 });
  if (doRender) render();
}
function remaining() {
  const sess = S.session;
  const learning = S.cards.filter((c) => isLearning(S.mem.get(c.id)) && !S.mem.get(c.id).suspended && !sess.queue.includes(c.id)).length;
  return sess.queue.length + learning;
}
function reveal() { if (S.session.current) { S.session.phase = "back"; render(); } }
async function grade() {
  const sess = S.session, c = S.byId.get(sess.current);
  if (!c || !sess.typed.trim() || !claudeReady()) return;
  const g = await ask(`grade:${c.id}`, gradePrompt(c, sess.typed.trim()));
  if (S.session !== sess || sess.current !== c.id) return;
  if (g) {
    const pts = Array.isArray(g.points) ? g.points : [];
    sess.grade = {
      points: pts.map((p) => ({ i: Number(p?.i) || 0, verdict: ["hit", "partial", "miss"].includes(p?.verdict) ? p.verdict : "miss", note: str(p?.note, 140) })),
      wrong: str(g.wrong, 300), feedback: str(g.feedback, 500), rating: [1, 2, 3, 4].includes(Number(g.rating)) ? Number(g.rating) : null,
    };
    sess.phase = "back";
  }
  render();
}
function rate(r) {
  const sess = S.session, c = S.byId.get(sess.current);
  if (!c || sess.phase !== "back") return;
  const now = Date.now();
  const prev = S.mem.get(c.id);
  const res = applyRating({ mem: prev, card: c, rating: r, now, config: S.config, sched: S.sched });
  res.log.d = Math.round(Math.min(Math.max(performance.now() - sess.t0 - sess.waitMs - sess.hiddenMs, 300), 600000));
  if (sess.typed.trim()) res.log.a = sess.typed.trim().slice(0, 600);
  if (sess.grade?.rating) res.log.g = sess.grade.rating;
  S.mem.set(c.id, res.mem);
  persist(`cards/${c.id}`, res.mem);
  const key = dayKey(now, roll());
  const items = S.logs.get(key) || [];
  items.push(res.log);
  S.logs.set(key, items);
  persist(`reviews/${key}`, { day: key, items });
  sess.undo = { id: c.id, prev: clone(prev), key, queue: sess.queue.slice(), reviewed: sess.reviewed, passed: sess.passed, typed: sess.typed, grade: sess.grade };
  sess.queue = sess.queue.filter((id) => id !== c.id);
  sess.reviewed++;
  if (r > 1) sess.passed++;
  sess.lastId = c.id;
  toast(`${RATING[r]}. Next in ${fmtInterval(res.intervalMs)}.`, { label: "Undo", fn: undoLast });
  advance();
}
function undoLast() {
  const sess = S.session, u = sess?.undo;
  if (!u) return;
  const restored = u.prev || blankMemory(Date.now());
  S.mem.set(u.id, restored);
  persist(`cards/${u.id}`, restored);
  const items = S.logs.get(u.key) || [];
  for (let i = items.length - 1; i >= 0; i--) if (items[i].c === u.id) { items.splice(i, 1); break; }
  persist(`reviews/${u.key}`, { day: u.key, items });
  Object.assign(sess, { queue: u.queue, reviewed: u.reviewed, passed: u.passed, undo: null, current: u.id, phase: "back", typed: u.typed, grade: u.grade, t0: performance.now(), waitMs: 0, hiddenMs: 0 });
  render();
}
async function explain(id) {

  const rw = cleanCard(x.rewrite ? { ...x.rewrite, kind: c.kind, points: c.points } : null);
  const rec = { diagnosis: str(x.diagnosis, 600), explanation: str(x.explanation, 1400), hook: str(x.hook, 300), contrast: cc, rewrite: rw, at: Date.now(), attempts: attemptsFor(id).length };

function deckStats(deck) {
  const cs = S.cards.filter((c) => c.deck === deck && !c.retired);
  const now = Date.now();
  let n = 0, rSum = 0, fresh = 0, learning = 0, susp = 0, misses = 0;
  for (const c of cs) {
    const m = S.mem.get(c.id);
    if (m?.suspended) susp++;
    if (isNew(m)) { fresh++; continue; }
    if (isLearning(m)) learning++;
    misses += m.agains || 0;
    const r = currentR(m, now, S.config, S.sched);
    if (r != null) { n++; rSum += r; }
  }
  return { total: cs.length, fresh, learning, susp, misses, meanR: n ? rSum / n : null };
}
