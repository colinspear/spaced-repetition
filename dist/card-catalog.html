 the grain' mean, and what goes wrong if you skip it?","answer":"State exactly what one fact row represents, for example one row per order line, or one row per ticket per status change. Skip it and grains get mixed in one table, which causes double counting and measures that are right only at some levels of aggregation.","points":["Grain = the business meaning of one row","Declared before dimensions and facts are chosen","Mixed grains lead to double counting and inconsistent measures"],"source":"Kimball & Ross"},{"id":"mod-10","kind":"fact","prompt":"An order moves through placed, paid, shipped and delivered, with one row per order whose milestone dates fill in over time. Which fact-table type?","answer":"Accumulating snapshot.","why":"Transaction: one row per event. Periodic snapshot: one row per period (inventory at month end). Accumulating snapshot: one row per process instance, updated as milestones occur. It's the natural home for durations between steps.","source":"Kimball & Ross"},{"id":"mod-11","kind":"fact","prompt":"Slowly changing dimension Types 1, 2 and 3, one line each.","answer":"Type 1: overwrite (no history). Type 2: add a new row with effective dates and a current flag (full history). Type 3: add a previous-value column (one step of history).","source":"Kimball & Ross"},{"id":"mod-12","kind":"concept","prompt":"What are a conformed dimension and a bus matrix, and why do they matter across teams?","answer":"A conformed dimension has the same keys and meaning everywhere it is used, such as one Customer, Date or Location dimension. That lets you drill across business processes. A bus matrix lists processes as rows and conformed dimensions as columns. It is the roadmap that keeps separately built models compatible.","points":["Same keys and meaning across fact tables","Enables drill-across between processes","Bus matrix = processes by shared dimensions, the integration plan"],"source":"Kimball & Ross"},{"id":"mod-13","kind":"concept","prompt":"Why do columnar analytical engines favor a star schema over one wide flat table or a deep snowflake?","answer":"Columnar storage compresses low-cardinality dimension columns well, and dimensions filter facts through simple one-to-many joins. A wide flat table repeats attributes on every row and invites inconsistent measures and grain errors. A deep snowflake adds join hops and confuses the people writing reports.","points":["Columnar compression favors low-cardinality dimension columns","Dimensions filter facts via one-to-many joins","Flat tables: repetition, grain errors, inconsistent measures","Snowflakes: extra hops and author confusion"],"source":"Kimball & Ross; BI vendor modeling guidance"},{"id":"mod-14","kind":"judgment","prompt":"A team wants 'one big flat table' so analysts can self-serve. What do you recommend, and how do you sell it?","answer":"Name the risks: mixed grains, double counting, and every report reinventing its measures. Offer a shared semantic model instead: a star schema with a few conformed dimensions and curated, documented measures. One certified model then feeds many reports. Teach people to build on that model rather than their own extracts. Sell it with a before-and-after on their own numbers, ideally a total that comes out differently today depending on who built the report.","points":["Name the risks: grain, double counting, inconsistent measures","Propose a shared semantic model (star, conformed dimensions, curated measures)","One certified model feeds many reports","Teach report building on the shared model","Persuade with their own numbers"],"source":"Synthesis"},{"id":"mod-15","kind":"concept","prompt":"ACID: what do the four letters guarantee about a database transaction?","answer":"Atomicity: all of a transaction's changes happen, or none do. Consistency: a transaction takes the database from one valid state to another, with every constraint still holding. Isolation: transactions running at the same time don't interfere, so the result is as if they ran one after another. Durability: once a transaction is committed, its changes survive a crash.","points":["Atomicity: all or nothing","Consistency: valid state to valid state","Isolation: concurrent transactions don't interfere","Durability: committed changes survive failure"],"why":"Why it matters: ACID is what lets a system of record be trusted. Many distributed and analytical stores relax parts of it for scale, so ask which guarantees a platform actually gives.","source":"Haerder & Reuter, Principles of Transaction-Oriented Database Recovery (1983)"},{"id":"mod-16","kind":"concept","prompt":"OLTP vs OLAP: how do the two workloads differ, and why does it matter for design?","answer":"OLTP (online transaction processing) runs the business: many short reads and writes of individual records, on current data, in a normalized design that protects integrity. OLAP (online analytical processing) analyzes the business: fewer, heavier queries that scan many rows of historical data, in a design shaped for reading. Heavy analysis on the transactional system slows operations, which is why analytical copies such as warehouses exist.","points":["OLTP: many short reads and writes of single records, current data","OLTP designs are normalized for integrity","OLAP: fewer, heavier queries over many rows of history","OLAP designs are shaped for reading","Separate analytical copies protect operational systems"],"source":"Standard database texts; Codd et al. coined OLAP (1993)"},{"id":"mod-17","kind":"fact","prompt":"Conceptual, logical and physical data models: what does each describe?","answer":"Conceptual: the business entities and relationships, in business terms, with no technical detail. Logical: entities, attributes, keys and relationships, fully defined but independent of any database product. Physical: the tables, columns, data types and indexes for a specific database.","why":"Why it matters: disagreements about meaning should be settled at the conceptual level, with the business, before anyone argues about tables.","source":"DAMA-DMBOK2, ch. 5 (Data Modeling and Design)"}]},{"deck":"arc","code":"ARC","title":"Data architecture","blurb":"Principles and paradigms, from warehouses and lakes to streams and meshes: what each one is, what it trades away, and why a data leader should care.","cards":[{"id":"arc-01","kind":"fact","prompt":"Inmon's definition of a data warehouse: its four properties.","answer":"Subject-oriented, integrated, time-variant, non-volatile.","why":"Hook: Inmon's warehouse keeps data in TINS: Time-variant, Integrated, Non-volatile, Subject-oriented. Two are about content (subject-oriented, integrated) and two about time (time-variant, non-volatile). Why it matters: it's the test of whether a 'warehouse' really is one. A pile of copied tables that isn't integrated, or keeps no history, is a staging area whatever it's called.","source":"W. H. Inmon, Building the Data Warehouse (1992)"},{"id":"arc-02","kind":"concept","prompt":"Inmon vs Kimball: how does each build a warehouse, and what does each trade away?","answer":"Inmon builds top-down: an integrated, normalized enterprise warehouse first, with dimensional marts derived from it. It is consistent from the start but slow and costly before it delivers. Kimball builds bottom-up: a dimensional mart for one business process at a time, tied together by conformed dimensions (the bus architecture). It delivers value early, but stays integrated only if the conformed dimensions are governed.","points":["Inmon: normalized enterprise warehouse first, marts downstream","Kimball: process-by-process star schemas joined by conformed dimensions","Inmon trades speed to value for upfront integration","Kimball trades upfront integration for speed; consistency depends on governing the shared dimensions"],"why":"Why it matters: most real warehouses are hybrids. The leadership question is where integration is enforced, and who owns the shared dimensions.","source":"Inmon (1992); Kimball & Ross, The Data Warehouse Toolkit"},{"id":"arc-03","kind":"concept","prompt":"Schema-on-write vs schema-on-read: where does each put the cost of structure, and what is the classic failure of schema-on-read?","answer":"Schema-on-write validates and structures data as it is loaded, as in a warehouse. The cost is paid up front, and queries are fast and trustworthy. Schema-on-read stores data raw and applies structure at query time, as in a data lake. Ingestion is fast and flexible, but every consumer pays the cost of interpretation, often in different ways. The classic failure is the data swamp: lots of raw data that nobody can find, trust or interpret consistently.","points":["Write: structure and validate at load; cost up front","Read: store raw, interpret at query; cost pushed to every consumer","Read invites inconsistent interpretations","Failure mode: the data swamp"],"why":"Why it matters: schema-on-read moves governance work downstream; it doesn't remove it. Without a catalog, owners and quality rules, a lake becomes a swamp.","source":"General; DAMA-DMBOK2 ch. 11"},{"id":"arc-04","kind":"concept","prompt":"ETL vs ELT: what made ELT the default, and what new risk does it bring?","answer":"Cheap, elastic storage and compute in the target platform. With ELT you load raw data first and transform it inside the warehouse or lakehouse. Raw history is kept, transformations become versioned code you can rerun, and new questions don't need a new extract. The risk is that raw data, sensitive fields included, lands in the analytical platform before anyone has cleaned, masked or classified it.","points":["Enabler: scalable storage and compute in the target","Load raw, transform in place","Benefits: raw history kept; transformations versioned and rerunnable","Risk: sensitive raw data lands before masking or classification"],"why":"Why it matters: under ELT, access control and classification of the raw layer become a governance requirement, not an afterthought.","source":"General data-engineering practice"},{"id":"arc-05","kind":"concept","prompt":"What is a lakehouse, and what does it add to a plain data lake?","answer":"A lakehouse keeps data in open file formats on cheap object storage, as a lake does, and adds a table layer with warehouse features: ACID transactions, schema enforcement and evolution, versioning (time travel) and performance indexing. BI and machine learning can then work from one governed copy instead of a lake plus a separate warehouse.","points":["Open formats on object storage (lake economics)","A table layer adds ACID transactions and schema enforcement","Versioning and time travel","One copy serves BI and ML, instead of a lake plus a warehouse"],"why":"Why it matters: fewer copies means fewer places for definitions and access rules to drift, but only if governance is applied at the table layer.","source":"Armbrust et al., Lakehouse: A New Generation of Open Platforms (CIDR 2021)"},{"id":"arc-06","kind":"fact","prompt":"Medallion architecture: what belongs in the bronze, silver and gold layers?","answer":"Bronze: raw data as ingested, kept for replay and audit. Silver: cleaned, validated, deduplicated and conformed data. Gold: business-level, consumption-ready tables and aggregates for specific uses.","why":"Why it matters: each layer is a natural home for a different control. Access and retention at bronze, quality rules at silver, certified definitions and ownership at gold.","source":"Common lakehouse practice; also called raw, cleansed and curated zones"},{"id":"arc-07","kind":"concept","prompt":"Lambda vs Kappa architecture: what problem does each solve, and what does Kappa remove?","answer":"Lambda runs two paths. A batch layer recomputes complete, correct results, and a speed layer gives fast, approximate ones; the two are merged when results are served. The cost is the same logic written and maintained twice. Kappa uses a single stream-processing path over a durable, replayable log. To reprocess, you replay the log through new code, which removes the duplicate batch codebase.","points":["Lambda: batch layer (complete) plus speed layer (fast), merged when served","Cost: duplicate logic in two codebases that can diverge","Kappa: one streaming path over a replayable log","Reprocessing means replaying the log"],"why":"Why it matters: two codebases for one metric means two answers waiting to happen. Before paying for either, ask whether anyone needs real time at all.","source":"Nathan Marz (2011); Jay Kreps, Questioning the Lambda Architecture (2014)"},{"id":"arc-08","kind":"concept","prompt":"The CAP theorem: what does it actually say, and what does PACELC add?","answer":"If a network partition splits a distributed data system, the system must choose between consistency (every read sees the latest write) and availability (every request gets an answer). It cannot guarantee both during the partition. PACELC adds that even without a partition, there is a trade-off between latency and consistency.","points":["It applies during a network partition","Choose consistency or availability, not both","It is not 'pick any two of three' at all times","PACELC: otherwise, latency vs consistency"],"why":"Why it matters: an eventually consistent system can show different users different numbers for a while. That's a design choice someone should own, and reports should say so.","source":"Brewer (2000); Gilbert & Lynch (2002); Abadi, PACELC (2012)"},{"id":"arc-09","kind":"concept","prompt":"Why did separating storage from compute change data architecture?","answer":"Storage and compute now scale and are paid for separately. Data sits once in cheap storage, and many engines or teams spin compute up and down over it. That made keeping raw history affordable, made ELT practical, let teams isolate their workloads from each other, and turned cost into a per-query, per-team question.","points":["Independent scaling and pricing","One copy, many engines and workloads","Raw history becomes affordable; ELT becomes practical","Workload isolation","Cost becomes per query and per team"],"why":"Why it matters: when cost follows usage, cost transparency and chargeback become governance topics.","source":"General cloud data-platform practice"},{"id":"arc-10","kind":"fact","prompt":"Row-oriented vs column-oriented storage: which serves transactions, which serves analytics, and why?","answer":"Row stores serve transactional systems: they read and write whole records quickly. Column stores serve analytics: queries scan a few columns across many rows, and keeping each column together compresses well and lets the engine skip data it doesn't need.","why":"Open columnar file formats (such as Parquet) let many tools read the same data, which limits lock-in.","source":"Standard database texts"},{"id":"arc-11","kind":"concept","prompt":"Log-based change data capture vs polling a 'last updated' timestamp: what does polling miss?","answer":"Polling misses hard deletes and any intermediate changes between polls. It depends on every writer setting the timestamp correctly, and it puts query load on the source. Log-based change data capture reads the database's transaction log, so it captures every insert, update and delete, in order, with little load on the source.","points":["Polling misses deletes","Polling misses intermediate changes","It relies on timestamps being maintained","It loads the source","Log-based CDC: every change, in order, low impact"],"why":"Why it matters: missed deletes are a quiet source of wrong counts, and they can break retention and deletion obligations downstream.","source":"Kleppmann, Designing Data-Intensive Applications (2017), ch. 11"},{"id":"arc-12","kind":"concept","prompt":"Data vault: what are hubs, links and satellites, and what is the model designed for?","answer":"Hubs hold business keys. Links hold relationships between business keys. Satellites hold descriptive attributes with their full history. The design favors auditability, loading in parallel, and absorbing new or changing sources without remodeling. It is an integration layer: star schemas are usually built on top of it for people to query.","points":["Hubs: business keys","Links: relationships","Satellites: descriptive attributes with history","Built for auditability, parallel loads and source change","Not for direct querying: stars on top"],"why":"Why it matters: it trades query simplicity for traceability. It fits places that need an audit trail of every source change.","source":"Dan Linstedt & Michael Olschimke, Building a Scalable Data Warehouse with Data Vault 2.0 (2015)"},{"id":"arc-13","kind":"fact","prompt":"The four master data management implementation styles, and which one leaves source systems untouched.","answer":"Registry, consolidation, coexistence, centralized (transactional). Registry leaves the sources untouched: it only keeps a cross-reference index that matches records across systems.","why":"From registry to centralized, each style takes more authority away from the source systems and costs more political capital. Start where the organization will accept it.","source":"Gartner MDM implementation styles; DAMA-DMBOK2 ch. 10"},{"id":"arc-14","kind":"concept","prompt":"Data fabric vs data mesh: how do they differ?","answer":"A data fabric is a technology approach: an integration layer driven by metadata (catalogs, active metadata, knowledge graphs, automation) that connects distributed data without moving all of it. A data mesh is an organizational approach: business domains own their data as products, on a shared self-serve platform under federated governance. One is mainly about tooling and the other mainly about ownership, and they can coexist.","points":["Fabric: technology, metadata-driven integration","Mesh: organization, domain ownership and data products","Fabric automates; mesh decentralizes accountability","Not mutually exclusive"],"why":"Why it matters: buying a fabric doesn't create ownership, and declaring a mesh doesn't create a platform.","source":"Gartner (data fabric); Dehghani, Data Mesh (2022)"},{"id":"arc-15","kind":"judgment","prompt":"Leadership wants to 'adopt data mesh.' There's a small central data team, a handful of business units with no data engineers, and low data maturity. What do you advise?","answer":"Mesh solves a scaling problem: a central team that has become the bottleneck for many capable domains. Here the domains can't yet own data products, so decentralizing would spread scarce skills thinner and fragment definitions. Adopt the parts that fit now: name domain data owners and stewards, treat key datasets as products with documented owners and quality expectations, and build a shared platform and standards centrally. Revisit decentralization as the domains build capacity.","points":["Mesh fits large organizations with many capable domains and a central bottleneck","Prerequisites: domain engineering capacity, a self-serve platform, federated governance","At low maturity, decentralizing fragments definitions and spreads skills thin","Adopt now: domain ownership, data-as-product thinking, shared standards","Revisit as domains mature"],"source":"Synthesis: Dehghani, Data Mesh (2022)"},{"id":"arc-16","kind":"concept","prompt":"What is a data contract, and what does it change about where quality is enforced?","answer":"An explicit, versioned agreement between a data producer and its consumers covering schema, meaning, quality expectations, freshness, and how changes will be announced. It is enforced automatically in the producer's pipelines. Quality moves upstream ('shift left'): a breaking change fails at the source instead of surfacing later as a broken report.","points":["Explicit, versioned producer-consumer agreement","Covers schema, meaning, quality, freshness and the change process","Enforced automatically, ideally in the producer's deployment pipeline","Shifts quality left to the producer"],"why":"Why it matters: it turns stewardship expectations into something checkable, and puts accountability with the team that can actually fix the data.","source":"Andrew Jones, Driving Data Quality with Data Contracts (2023)"},{"id":"arc-17","kind":"concept","prompt":"What does a semantic layer do, and why does it matter for consistent numbers?","answer":"It defines business metrics, dimensions and joins once, in a governed layer between the data and the tools that use it. Dashboards, notebooks and spreadsheets all query those shared definitions instead of re-implementing them, so the same question returns the same number wherever it's asked.","points":["Metrics, dimensions and joins defined once","Sits between the data and the tools","Every tool reuses the definitions","One question, one number"],"why":"Why it matters: it's where glossary definitions become executable. Without it, every report author re-derives 'active customer'.","source":"General BI practice"},{"id":"arc-18","kind":"concept","prompt":"Event sourcing: what is it, and what do you gain and pay?","answer":"State changes are stored as an append-only log of immutable events, and current state is derived by replaying them. You gain a complete audit trail, the ability to reconstruct state at any past moment, and the freedom to build new views from history. You pay in complexity: evolving event schemas, the cost of replays, and queries that need separate read models.","points":["Append-only log of immutable events","Current state derived by replay","Gains: audit trail, point-in-time reconstruction, new views from history","Costs: event schema evolution, replay cost, separate read models"],"why":"Why it matters: it makes 'what did we know, and when?' answerable, which is what auditors ask.","source":"Martin Fowler, Event Sourcing (2005); Kleppmann (2017)"},{"id":"arc-19","kind":"concept","prompt":"Conway's law: what does it predict about data architecture?","answer":"Systems mirror the communication structure of the organizations that build them. Siloed departments produce siloed data and definitions that don't line up. Changing the architecture without changing who talks to whom, and who owns what, rarely sticks. The 'inverse Conway maneuver' shapes teams deliberately to get the architecture you want.","points":["Systems mirror organizational communication structure","Silos produce siloed data","Architecture change needs ownership and communication change","Inverse Conway: design the teams to get the architecture"],"why":"Why it matters: data architecture is partly an organization-design decision, which puts it on a data leader's agenda, not only IT's.","source":"Melvin Conway, How Do Committees Invent? (1968)"},{"id":"arc-20","kind":"judgment","prompt":"A mid-size organization with a small data team, mostly daily and monthly reporting, and some sensitive data asks what architecture to adopt. What do you recommend?","answer":"Start from the decisions and how fast they need data: most reporting is fine with daily batch, so avoid streaming until a decision really needs it. Choose a simple central platform with layered zones (raw, cleaned, curated) and ELT, and put a dimensional or semantic presentation layer on top so definitions are shared. Build access control, classification and lineage in from the first load, because the raw layer will hold sensitive data. Prefer open formats to limit lock-in, use change data capture where sources support it, and size everything to what the team can operate.","points":["Start from decisions and latency needs; batch by default","Simple central platform, layered zones, ELT","Dimensional or semantic presentation layer","Security, classification and lineage from day one","Open formats; CDC where possible","Fit what the team can operate"],"source":"Synthesis"},{"id":"arc-21","kind":"concept","prompt":"Batch or streaming: what question settles it?","answer":"Which decision changes if the data arrives in seconds instead of hours, and who will act on it that fast? If nothing changes, batch is cheaper, simpler and easier to get right. Stream where the value of data decays quickly: fraud, dispatch, alerting.","points":["Ask which decision needs the lower latency","Who acts on it that fast?","Batch: cheaper, simpler, easier to make correct","Stream where value decays fast"],"why":"Why it matters: 'real-time' is often requested and rarely used. 'Right-time' is the better requirement.","source":"General"}]},{"deck":"lnk","code":"LNK","title":"Entity resolution & master data","blurb":"Deciding which records refer to the same person, place or thing, and keeping one trusted version: what it takes, and which trade-offs are yours to own.","cards":[{"id":"lnk-01","kind":"fact","prompt":"Fellegi-Sunter: define the m- and u-probabilities for a field.","answer":"m = P(field agrees | the records are a true match). u = P(field agrees | the records are not a match).","source":"Fellegi & Sunter (1969)","retired":true,"retiredWhy":"Marked too detailed. Replaced by the leader-level rewrite you accepted."},{"id":"lnk-02","kind":"concept","prompt":"How do m and u become a match weight, and how do the weights combine?","answer":"Agreement on a field adds log2(m/u). Disagreement adds log2((1-m)/(1-u)). Assuming conditional independence, the field weights and the prior log-odds sum to a total match weight in log2 odds. Convert to a probability with p = 2^w / (1 + 2^w).","points":["Agreement weight log2(m/u)","Disagreement weight log2((1-m)/(1-u))","Sum across fields plus prior (conditional independence)","Weight is log-odds; convert to probability"],"source":"Fellegi & Sunter (1969); Splink documentation","retired":true,"retiredWhy":"Marked too detailed: the weight arithmetic is implementation, not principle."},{"id":"lnk-03","kind":"concept","prompt":"What does blocking do, and what is its main failure mode?","answer":"Blocking compares only the record pairs that share a blocking key (say, same postcode and first initial), which turns n-squared comparisons into something tractable. Its failure mode is that a true match with an error in the blocking field is never compared at all. The fix is several blocking rules whose results are unioned.","points":["Restricts comparisons to candidate pairs","Errors in the blocking field cause unrecoverable misses","Use several blocking rules, unioned"],"source":"Christen, Data Matching (2012)","retired":true,"retiredWhy":"Implementation detail, below the level marked just right."},{"id":"lnk-04","kind":"concept","prompt":"Why should agreement on 'Zbigniewski' count for more than agreement on 'Smith'?","answer":"Because u depends on the value. Two random people are far more likely to share a common surname than a rare one. A term-frequency adjustment computes u from the frequency of that specific value, so agreement on a rare value counts as stronger evidence.","points":["u varies by value frequency","Rare-value agreement is stronger evidence","Term-frequency adjustment"],"source":"Splink documentation; Winkler","retired":true,"retiredWhy":"Implementation detail, below the level marked just right."},{"id":"lnk-05","kind":"fact","prompt":"How are u-probabilities usually estimated, and why does that work?","answer":"By randomly sampling record pairs. Almost all random pairs are non-matches, so their agreement rate approximates u. m comes from EM within blocks or from labeled pairs.","source":"Splink documentation","retired":true,"retiredWhy":"Implementation detail, below the level marked just right."},{"id":"lnk-06","kind":"judgment","prompt":"You are linking people between two organizations' client datasets to coordinate services. How do you set match thresholds?","answer":"Use two thresholds: auto-link above the upper one, reject below the lower one, and send the band between them to clerical review. Set them from what each error costs in this use. A false merge, which combines two people's histories, usually does more harm in service settings (wrong eligibility, privacy exposure) than a missed link. Estimate precision and recall on a labeled sample, size the review band to the staff who will work it, and monitor for drift.","points":["Two thresholds with a clerical-review band","Set from the asymmetric costs of false merges vs missed links","False merges usually worse in service contexts","Precision/recall on a labeled sample","Size the review band to capacity; monitor drift"],"source":"Synthesis"},{"id":"lnk-07","kind":"concept","prompt":"Why is an address string, on its own, a weak key for linking people?","answer":"Formats vary (St vs Street, unit designators, directionals). Many people share one address: households, multi-unit buildings, shelters. People move, so an address is only true for a period of time. PO boxes and institutional addresses add noise. Linking on address alone merges households into individuals.","points":["Format variation","Shared addresses (households, multi-unit, shelters)","Temporal: people move","Conflates households with individuals"],"source":"General"},{"id":"lnk-08","kind":"concept","prompt":"A new matching method raises the match rate from 82% to 95%. Why isn't that evidence it's better?","answer":"Match rate counts how many records got a match, not whether the matches are right. Loosening any matcher raises the rate by adding false matches. Judge it by precision and recall against a labeled sample, and report both alongside the rate.","points":["Match rate is not match accuracy","Looser matching inflates the rate with false matches","Measure precision and recall on labeled pairs","Report both, not the rate alone"],"source":"Christen, Data Matching (2012)"},{"id":"lnk-09","kind":"concept","prompt":"What is entity resolution, and why should a data leader care about it?","answer":"Entity resolution, also called record linkage or matching, decides which records within or across systems refer to the same real-world person, organization, place or thing when they share no reliable identifier. Without it the same entity is counted several times, its history is split across systems, and nobody can produce a single view of a customer or client. It brings two errors to govern: false merges, which combine different entities, and missed matches.","points":["Decides which records refer to the same real-world entity","Needed when there is no shared, reliable identifier","Without it: double counting, split history, no single view","Two errors to govern: false merges and missed matches"],"why":"Why it matters: how many wrong merges and missed matches are acceptable is a business decision with real consequences, so it shouldn't be left as a technical default.","source":"Christen, Data Matching (2012); DAMA-DMBOK2, ch. 10"},{"id":"lnk-10","kind":"concept","prompt":"Deterministic vs probabilistic matching: how does each decide, and what does each trade away?","answer":"Deterministic matching links records when chosen fields agree exactly, or by fixed rules. It's simple, fast and easy to explain, but it misses true matches that contain typos, name changes or missing values. Probabilistic matching weighs the evidence from several fields and scores how likely a pair is to be a match. It finds more true matches in messy data, but it needs thresholds, tuning and a review process for the uncertain cases.","points":["Deterministic: exact agreement or fixed rules","Simple and explainable, but misses messy true matches","Probabilistic: weighs evidence across fields into a score","Finds more matches, but needs thresholds, tuning and review"],"source":"Christen, Data Matching (2012); Fellegi & Sunter (1969)"},{"id":"lnk-11","kind":"concept","prompt":"In master data management, what is a golden record, and what are survivorship rules?","answer":"A golden record is the single best version of an entity, assembled from the matched records in different systems. Survivorship rules decide which source's value wins for each attribute when the sources disagree: for example the most recently updated address, or the most trusted system for a date of birth. The rules encode judgments about which source to trust for what, so the business should own them and they should be written down.","points":["Golden record: the best single version, built from matched records","Survivorship rules: which value wins, attribute by attribute","Typical rules: most recent, most trusted source, most complete","The rules are business decisions: owned and documented"],"source":"DAMA-DMBOK2, ch. 10 (Reference and Master Data); Loshin, Master Data Management (2009)"},{"id":"lnk-12","kind":"fact","prompt":"Master data, reference data, transactional data: what is each?","answer":"Master data: the core entities the organization operates on, such as customers, products, employees and locations. Reference data: the code lists and classifications used to categorize other data, such as country or status codes. Transactional data: records of events involving those entities, such as orders and payments.","why":"Why it matters: master and reference data are shared across systems, so an error there spreads everywhere. That's why they get governed first.","source":"DAMA-DMBOK2, ch. 10"}]},{"deck":"prv","code":"PRV","title":"Privacy & disclosure","blurb":"Re-identification, suppression and noise: what to check before a table, map or dataset goes out.","cards":[{"id":"prv-01","kind":"fact","prompt":"Sweeney's classic re-identification finding: which three attributes uniquely identify about 87% of the US population?","answer":"5-digit ZIP code, gender, and full date of birth.","why":"The general lesson: a handful of ordinary attributes is enough to single people out, so 'no names' is not 'anonymous'.","source":"L. Sweeney, Simple Demographics Often Identify People Uniquely (2000)"},{"id":"prv-02","kind":"concept","prompt":"What is k-anonymity, and what attack does it fail against?","answer":"Each record is indistinguishable from at least k-1 others on its quasi-identifiers. It fails against homogeneity: if everyone in the group shares the same sensitive value, that value is disclosed anyway. l-diversity addresses this, and background-knowledge attacks also defeat k-anonymity.","points":["Indistinguishable from k-1 others on quasi-identifiers","Homogeneity attack","Background knowledge attack","l-diversity as the fix for homogeneity"],"source":"Sweeney (2002); Machanavajjhala et al. (2007)"},{"id":"prv-03","kind":"concept","prompt":"You suppress one small cell in a published table but keep the row and column totals. What's the problem?","answer":"The hidden value can be recovered by subtracting from the totals. You need complementary (secondary) suppression of other cells, or rounding or perturbation, so that no hidden cell can be derived.","points":["Recoverable by subtraction from margins","Complementary suppression","Or rounding/perturbation"],"source":"Federal Committee on Statistical Methodology, Statistical Policy Working Paper 22"},{"id":"prv-04","kind":"concept","prompt":"Differential privacy in two sentences: what is guaranteed, and what does epsilon control?","answer":"Adding or removing any one person changes the probability of any output by at most a factor of e^epsilon, so results reveal little about any individual. A smaller epsilon means more noise and more privacy, and every query spends from a finite privacy-loss budget.","points":["One person's presence changes output probabilities by at most e^epsilon","Smaller epsilon = more noise, more privacy","Composition: queries spend a finite budget"],"source":"Dwork & Roth, The Algorithmic Foundations of Differential Privacy (2014)"},{"id":"prv-05","kind":"concept","prompt":"What is the mosaic effect, and how does it change how you review a data release?","answer":"Releases that are each harmless can be combined, with each other or with outside data, to identify people. So you assess a release against everything already published and plausibly available, not in isolation, and you track what has gone out before.","points":["Individually safe releases can combine into disclosure","Outside data counts too","Review cumulatively, not release by release","Keep a record of what has been published"],"source":"US OMB M-13-13 (Open Data Policy); disclosure-control literature"},{"id":"prv-06","kind":"fact","prompt":"Data minimization and purpose limitation: state each in one line.","answer":"Minimization: collect and keep only the data needed for a stated purpose. Purpose limitation: don't reuse data for purposes incompatible with the one it was collected for.","why":"Both appear in the Fair Information Practice Principles and in GDPR Article 5. Data you never collected can't leak.","source":"FIPPs; GDPR Art. 5(1)(b)-(c)"},{"id":"prv-07","kind":"judgment","prompt":"A team wants to publish a map of individual service requests at their exact addresses. What risks do you raise, and what do you propose?","answer":"Exact points at single-household addresses identify households, and some request types are sensitive: welfare checks, possible domestic or mental-health situations, complaints about a neighbor. The person who complained can often be inferred. Propose aggregating to a street segment, block or larger area, or snapping points to the block. Suppress small counts and exclude sensitive request types. Get legal or privacy review, and publish documentation explaining the protections.","points":["Household identification at single-household addresses","Sensitive request types","Requester inference","Aggregate or snap locations; suppress small counts; exclude sensitive types","Privacy/legal review and documented protections"],"source":"Synthesis"}]},{"deck":"evd","code":"EVD","title":"Evidence & measurement","blurb":"The traps that wreck analytics: selection, small numbers, shifting mixes, broken series, proxies and measures that become targets.","cards":[{"id":"evd-01","kind":"concept","prompt":"An intervention targets the 10 sites with the most incidents last quarter, and incidents drop the next quarter. Why isn't that evidence it worked?","answer":"Regression to the mean. Sites picked because they had an extreme period tend to look more typical the next period whether or not anything was done. You need a comparison group selected the same way, or longer pre-intervention trends.","points":["Selection on an extreme value","Regression to the mean happens without any intervention","Comparison group chosen the same way, or longer pre-trends"],"source":"Standard; see Campbell & Ross (1968) on the Connecticut speeding crackdown"},{"id":"evd-02","kind":"fact","prompt":"State Campbell's law.","answer":"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor.","why":"Close relative of Goodhart's law (popular form, after Strathern): when a measure becomes a target, it ceases to be a good measure.","source":"Donald T. Campbell, Assessing the Impact of Planned Social Change (1979)"},{"id":"evd-03","kind":"fact","prompt":"What is the identifying assumption of difference-in-differences?","answer":"Parallel trends: absent the treatment, the treated and comparison groups would have changed by the same amount.","why":"Check the pre-period trends, and look for anything else that changed at the same time.","source":"Standard econometrics"},{"id":"evd-04","kind":"concept","prompt":"Why do 'top 10 by rate' rankings of branches, schools or neighborhoods keep featuring the smallest ones, and what do you do about it?","answer":"Small denominators make rates noisy, so by chance small units fill both the top and the bottom of the ranking. Use funnel plots, empirical-Bayes shrinkage toward the overall rate, minimum denominators, or pooled years, and show the uncertainty.","points":["Small denominators produce extreme rates in both directions","Funnel plots or shrinkage","Minimum denominators or pooled years","Show uncertainty"],"source":"Gelman & Price, All maps of parameter estimates are misleading (1999)"},{"id":"evd-05","kind":"judgment","prompt":"An executive asks for 'the 10 worst locations for complaints' from raw counts. What do you ask and adjust before you send a list?","answer":"Normalize by an exposure measure (customers, units, visits) rather than using raw counts. Raise detection bias: complaints reflect who complains and where staff look, not only where problems are. Small numbers make rankings unstable, so pool time or shrink the rates. Pin down the time window and which complaints count (type, severity, open or closed). Ask what decision the list is for, and present it with uncertainty and context.","points":["Normalize by exposure","Detection and reporting bias","Small-number instability","Define the window and the categories","Ask what decision it informs; show uncertainty"],"source":"Synthesis"},{"id":"evd-06","kind":"concept","prompt":"Average resolution time improved in every region, yet the organization-wide average got worse. How?","answer":"Simpson's paradox. The mix shifted: more cases now come from regions or case types with long resolution times, so the weighted average rises even though every subgroup improved. Report stratified figures or standardize the mix.","points":["Composition shift between subgroups","Weighted average can move against every subgroup","Stratify or standardize"],"source":"Standard"},{"id":"evd-07","kind":"concept","prompt":"Inspections, complaints and enforcement records all count something. What do they actually measure, and what follows?","answer":"They record the organization's process: where it looked, who reported, what staff chose to write down. That mixes the underlying problem with effort and reporting behavior. More inspectors or an easier complaint channel raise counts with no change in the problem. Model or at least report effort alongside the counts, and be wary of comparing areas with different detection.","points":["Administrative data measures the process, not just the phenomenon","Counts move with effort and reporting behavior","Report effort alongside counts","Detection differences confound comparisons"],"source":"Standard measurement practice"},{"id":"evd-08","kind":"concept","prompt":"A metric's definition, source system or coverage changes partway through a time series. What do you do?","answer":"Treat it as a break in the series, not a trend. Mark the break on every chart, run old and new methods in parallel for an overlap period if you can, and either bridge (back-cast) with the overlap or report the two segments separately.","why":"Example: US national crime statistics broke in 2021 when the FBI moved to an incident-based system and many agencies hadn't converted.","points":["A method change is a break, not a trend","Annotate the break","Parallel run for an overlap period","Bridge with the overlap, or report segments separately"],"source":"Standard statistical practice"},{"id":"evd-09","kind":"fact","prompt":"Two estimates have overlapping 95% confidence intervals. Does that mean the difference isn't significant?","answer":"No. Test the difference itself. For independent estimates its standard error is sqrt(SE1² + SE2²), which is smaller than SE1 + SE2, so intervals can overlap while the difference is still significant.","source":"Schenker & Gentleman, On judging the significance of differences by examining the overlap between confidence intervals (2001)"},{"id":"evd-10","kind":"concept","prompt":"A field classifies records for one administrative purpose, such as a land-use code for tax assessment. Why is it risky to use it to count a real-world state, like vacant buildings?","answer":"The code answers the question its process asks, not yours. An abandoned house usually keeps its residential code, and codes lag reality. Treat it as a proxy, look for direct signals of the state you care about, validate the proxy against ground truth, and define the target state explicitly.","points":["Codes answer their own process's question","Classification lags and diverges from reality","Seek direct signals; triangulate sources","Validate the proxy against ground truth","Define the target state explicitly"],"source":"Standard measurement practice"}]},{"deck":"sta","code":"STA","title":"Statistics & ML for leaders","blurb":"The ideas you need to question an analysis or a model claim: overfitting, error types, base rates, significance and causation.","cards":[{"id":"sta-01","kind":"concept","prompt":"What is overfitting, and how do you detect it?","answer":"A model overfits when it learns the quirks and noise of its training data instead of the underlying pattern. It then looks excellent on the data it was built from and does worse on new data. You detect it by testing on data the model has never seen: a large gap between training performance and held-out performance is the sign.","points":["Learns noise and quirks of the training data, not the general pattern","Excellent on training data, worse on new data","Detect with held-out data the model never saw","A large train-test gap is the sign"],"source":"Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2009)"},{"id":"sta-02","kind":"concept","prompt":"What is data leakage in machine learning, and why does it produce models that look better than they are?","answer":"Leakage is when information that wouldn't be available at prediction time gets into the training data: a field recorded after the outcome, or the same person appearing in both the training and test sets. The model learns to exploit it, scores unrealistically well in testing, and fails in real use. A result that looks too good is the usual warning sign.","points":["Training uses information unavailable at prediction time","Examples: fields recorded after the outcome; the same entity in train and test","Test scores are inflated; real-world performance collapses","Suspiciously good results are the warning sign"],"source":"Kaufman et al., Leakage in Data Mining (2012)"},{"id":"sta-03","kind":"concept","prompt":"Precision vs recall: what does each measure, and why is 'accuracy' misleading for rare events?","answer":"Precision: of the cases the model flagged, the share that were truly positive. Recall: of the truly positive cases, the share the model caught. Accuracy misleads when the event is rare: if 1% of cases are fraud, a model that never flags anything is 99% accurate and useless. Raising one of precision and recall usually lowers the other, so the right balance depends on what each kind of error costs.","points":["Precision: of those flagged, the share truly positive","Recall: of true positives, the share caught","With rare events, 'always say no' scores high accuracy","There is a trade-off between the two","The balance depends on the cost of each error"],"source":"Standard; any machine-learning text"},{"id":"sta-04","kind":"concept","prompt":"A test is 95% accurate and the condition affects 1 in 100 people. Someone tests positive. Roughly how likely are they to have it, and what is the lesson?","answer":"About 1 in 6. In 10,000 people, 100 have the condition and about 95 test positive. Of the 9,900 who don't, 5% test positive anyway: about 495. So only 95 of roughly 590 positives are real, around 16%. The lesson is the base rate: when a condition is rare, most positives are false, even from a good test.","points":["About 16%, or 1 in 6","True positives: about 95 of 100","False positives: about 495 of 9,900","When the base rate is low, most positives are false"],"why":"This assumes '95% accurate' means it catches 95% of real cases and wrongly flags 5% of the rest. The same arithmetic applies to any screening model for a rare outcome.","source":"Standard (Bayes' rule); see Gigerenzer, Calculated Risks (2002)"},{"id":"sta-05","kind":"concept","prompt":"What does a p-value of 0.03 mean, and what doesn't it mean?","answer":"It means that if there were truly no effect, and the model's assumptions held, a result at least this extreme would occur about 3% of the time. It doesn't mean there is a 3% chance the finding is false or a 97% chance it's true, and it says nothing about how large or important the effect is.","points":["The probability of data this extreme, assuming no real effect","Not the probability that the hypothesis is true or false","Says nothing about the size or importance of the effect","Depends on the assumptions of the analysis"],"source":"Wasserstein & Lazar, The ASA Statement on p-Values (2016)"},{"id":"sta-06","kind":"concept","prompt":"Statistical significance vs practical significance: why isn't a 'significant' result necessarily worth acting on?","answer":"Statistical significance says an effect is unlikely to be pure chance. It doesn't say the effect is big enough to matter. With a large enough sample, a trivially small difference becomes significant. So look at the effect size and its confidence interval, and compare them with the smallest change that would justify the cost of acting.","points":["Significance: unlikely to be chance alone","It says nothing about whether the effect is big enough to matter","Large samples make tiny effects significant","Look at effect size and confidence interval","Compare with the smallest change worth acting on"],"source":"Wasserstein & Lazar (2016); standard"},{"id":"sta-07","kind":"concept","prompt":"Why can't you read causation from a correlation, and why does random assignment fix it?","answer":"Two things can move together because one causes the other, because the causation runs the other way, or because a third factor, a confounder, drives both. People who choose a program differ from those who don't in ways that also affect the outcome. Random assignment makes the groups alike, on average, in everything except the treatment, known and unknown, so a difference in outcomes can be attributed to it.","points":["Correlation can come from reverse causation","Or from a confounder driving both","Self-selected groups differ in ways that affect the outcome","Randomization balances known and unknown factors on average","So the outcome difference can be attributed to the treatment"],"source":"Standard; Angrist & Pischke, Mostly Harmless Econometrics (2009)"},{"id":"sta-08","kind":"concept","prompt":"An analyst tests 20 different breakdowns and reports the one significant result. What's the problem?","answer":"Multiple comparisons. At the usual 5% threshold, about one in twenty tests comes out significant by chance when nothing is going on, so testing 20 breakdowns and reporting the winner is close to guaranteed to find something. The fixes are to decide the comparisons before looking, report all the tests that were run, adjust the threshold for the number of tests, and confirm the finding on fresh data.","points":["At a 5% threshold, about 1 in 20 tests is significant by chance","Reporting only the winner hides the search","Decide comparisons in advance","Report every test run; adjust for the number of tests","Confirm on fresh data"],"source":"Gelman & Loken, The Garden of Forking Paths (2013)"},{"id":"sta-09","kind":"concept","prompt":"What is survivorship bias? Give the classic example.","answer":"Drawing conclusions from the cases that made it through some selection, while the ones that didn't are missing from the data. The classic example is wartime bomber armor: returning aircraft had bullet holes in the wings and fuselage, and the statistician Abraham Wald pointed out that the armor belonged where the returning planes had no holes, because planes hit there hadn't come back.","points":["Only the cases that passed a filter are observed","The missing cases would change the conclusion","Wald: armor where returning planes had no holes","Ask what is missing from the data, and why"],"source":"Wald's wartime work for the Statistical Research Group; Mangel & Samaniego (1984)"},{"id":"sta-10","kind":"fact","prompt":"What four things determine the sample size an experiment needs?","answer":"The smallest effect you want to be able to detect, how variable the outcome is, the significance level, and the statistical power you want (the chance of detecting a real effect of that size).","why":"The smaller the effect, the bigger the sample: halving the detectable effect needs about four times as many observations. An underpowered test that finds nothing has shown little.","source":"Standard; Cohen, Statistical Power Analysis for the Behavioral Sciences (1988)"},{"id":"sta-11","kind":"judgment","prompt":"A vendor says their model predicts an outcome you care about 'with 95% accuracy.' What do you ask before you believe it?","answer":"How common is the outcome? If it's rare, 95% may be no better than always saying no, so ask for precision and recall. What data was it tested on: data it never saw, from a population and time period like yours? Could any input contain information that wouldn't be available when the prediction is made? How does performance vary across groups? And how will it be monitored once conditions change?","points":["Ask for the base rate; accuracy can be empty for rare outcomes","Ask for precision and recall","Tested on unseen data like yours, in population and time","Check for leakage in the inputs","Performance across groups","Monitoring for drift after deployment"],"source":"Synthesis"}]},{"deck":"aig","code":"AIG","title":"AI & model governance","blurb":"What a data leader needs to govern models and generative AI: risk frameworks, documentation, drift, fairness and the limits of oversight.","cards":[{"id":"aig-01","kind":"fact","prompt":"The four functions of the NIST AI Risk Management Framework.","answer":"Govern, Map, Measure, Manage.","why":"Govern sets the culture, roles and policies and runs through the other three. Map establishes the context and identifies the risks of a system. Measure assesses and tracks them. Manage prioritizes and acts on them.","source":"NIST, AI Risk Management Framework 1.0 (2023)"},{"id":"aig-02","kind":"fact","prompt":"The EU AI Act sorts AI systems into four risk tiers. Name them and what each means.","answer":"Unacceptable risk: prohibited. High risk: allowed with strict obligations such as risk management, documentation and human oversight. Limited risk: transparency duties, such as telling people they're dealing with AI. Minimal risk: no new obligations.","why":"Why it matters even outside the EU: the risk-tier idea is the common pattern for AI policy. Classify the use, then scale the controls to the risk.","source":"Regulation (EU) 2024/1689 (the AI Act)"},{"id":"aig-03","kind":"concept","prompt":"What are model cards and datasheets for datasets, and what problem do they solve?","answer":"A model card is a short standard document that travels with a model: what it's for, what it isn't for, the data it was trained and evaluated on, and how well it performs, including across different groups. A datasheet does the same for a dataset: why and how it was collected, what's in it, and its known gaps and recommended uses. Both make the limits visible to the people who reuse the model or data, who usually weren't there when it was built.","points":["Model card: intended use, out-of-scope use, training and evaluation data, performance","Performance reported across groups, not only overall","Datasheet: why and how the data was collected, composition, gaps, recommended uses","Purpose: limits stay visible to people who reuse it later"],"source":"Mitchell et al., Model Cards for Model Reporting (2019); Gebru et al., Datasheets for Datasets (2021)"},{"id":"aig-04","kind":"concept","prompt":"Why does a model that tested well get worse after deployment? Distinguish data drift from concept drift.","answer":"A model learns from a snapshot of the world, and the world moves. Data drift: the inputs change, for example a new customer mix or a changed form, so the model sees cases unlike its training data. Concept drift: the relationship between inputs and the outcome changes, so the same inputs now mean something different. Both call for monitoring inputs and outcomes after launch, with a plan for retraining or retiring the model.","points":["Models are trained on a snapshot; the world changes","Data drift: the distribution of inputs shifts","Concept drift: the input-outcome relationship shifts","Monitor inputs and outcomes after launch","Have a retraining or retirement plan"],"source":"Gama et al., A Survey on Concept Drift Adaptation (2014)"},{"id":"aig-05","kind":"concept","prompt":"The fairness 'impossibility' result: what can't a risk-scoring model achieve at once, and what follows?","answer":"When two groups have different underlying rates of the outcome, a score can't be both equally well calibrated for each group and have equal false positive and false negative rates across them, except in trivial cases. So 'is the model fair?' has no single technical answer. Someone has to choose which fairness definition matters for this use, and that is a policy decision to make openly and document.","points":["Applies when base rates differ between groups","Calibration and equal error rates can't all hold together","No single technical definition of 'fair'","Choosing the definition is a policy decision, made openly and documented"],"source":"Kleinberg, Mullainathan & Raghavan (2016); Chouldechova (2017)"},{"id":"aig-06","kind":"concept","prompt":"What is a 'hallucination' in a large language model, and what reduces the risk?","answer":"A language model generates fluent, plausible text, and some of it is false or unsupported: invented facts, citations or figures, stated with the same confidence as true ones. The model predicts likely text; it doesn't look facts up unless it's given a way to. The risk is reduced by grounding answers in supplied source documents, requiring citations that can be checked, testing on realistic questions before launch, and keeping a person responsible for consequential outputs.","points":["Fluent, confident output that is false or unsupported","The model predicts plausible text rather than retrieving facts","Ground answers in supplied sources","Require checkable citations","Evaluate before launch; keep a person accountable for consequential outputs"],"source":"General; see NIST AI 600-1, Generative AI Profile (2024), on confabulation"},{"id":"aig-07","kind":"concept","prompt":"What is retrieval-augmented generation, and why does it turn data governance into an AI issue?","answer":"Retrieval-augmented generation (RAG) first searches a collection of documents or data for material relevant to a question, then gives that material to a language model to write the answer from. The answer can only be as good as what's retrieved. Outdated, duplicated or wrong documents produce confident wrong answers, and if retrieval ignores access permissions, the assistant can reveal content the person asking shouldn't see.","points":["Retrieve relevant material first, then generate the answer from it","Answer quality is bounded by the quality of the content retrieved","Stale, duplicate or wrong content yields confident wrong answers","Retrieval must respect access permissions","So content quality, ownership and access control become AI prerequisites"],"source":"Lewis et al., Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (2020)"},{"id":"aig-08","kind":"concept","prompt":"Why is 'a human reviews every decision' a weaker safeguard than it sounds?","answer":"Automation bias: people tend to accept an automated recommendation, especially under time pressure or when the system is usually right, so review becomes a rubber stamp. Oversight works only when the reviewer has the time, information, skill and authority to disagree, and when overrides are tracked. Otherwise the person takes the accountability without having real control.","points":["Automation bias: people defer to automated recommendations","Worse under time pressure and when the system is usually right","Real oversight needs time, information, skill and authority to disagree","Track override rates","Otherwise accountability without control"],"source":"Parasuraman & Manzey, Complacency and Bias in Human Use of Automation (2010)"},{"id":"aig-09","kind":"concept","prompt":"Model risk management, as set out in the US banking guidance SR 11-7: what is model risk, and what are the three pillars of managing it?","answer":"Model risk is the potential for harm from decisions based on models that are wrong or misused. The guidance rests on three pillars. Sound development, implementation and use: a clear purpose, tested, used only as intended. Independent validation: people who didn't build the model test it and have the standing to challenge it. Governance: policies, defined roles and an inventory of every model in use.","points":["Model risk: harm from wrong or misused models","Sound development, implementation and use","Independent validation with effective challenge","Governance: policies, roles and a model inventory"],"why":"It was written for banks, but it has become the reference pattern for model governance in other sectors.","source":"Federal Reserve & OCC, SR 11-7: Supervisory Guidance on Model Risk Management (2011)"},{"id":"aig-10","kind":"judgment","prompt":"A department wants to launch a generative AI assistant that answers staff questions from internal documents. What do you require before it goes live?","answer":"A named owner and a stated purpose, including what it must not be used for. A check of the document collection: current, de-duplicated, and with access permissions the assistant respects. An evaluation on realistic questions with known answers, including ones it should decline. Answers that cite their sources so staff can verify them. Clear guidance on what staff remain responsible for. And monitoring after launch: a way to report bad answers, usage review, and a plan to fix or withdraw it.","points":["Named owner, stated purpose and out-of-scope uses","Source content is current, de-duplicated and permission-aware","Evaluated on realistic questions with known answers before launch","Answers cite sources","Staff know what they remain responsible for","Monitoring, feedback channel and a withdrawal plan"],"source":"Synthesis: NIST AI RMF (2023); NIST AI 600-1 (2024)"}]},{"deck":"chg","code":"CHG","title":"Change management","blurb":"Models for why change stalls and what moves it: urgency, transitions, adoption curves, defaults and resistance.","cards":[{"id":"chg-01","kind":"fact","prompt":"Lewin's three-stage model of change.","answer":"Unfreeze, change, refreeze.","why":"Unfreezing (making the case that the current state can't continue) is the stage most often skipped. Refreezing is what keeps a change from sliding back.","source":"Kurt Lewin (1947)"},{"id":"chg-02","kind":"concept","prompt":"Bridges distinguishes change from transition. What's the difference, and what are the three phases of a transition?","answer":"Change is the external event: the new system, structure or rule. Transition is the psychological process people go through to come to terms with it. Its phases are endings (letting go of the old way and identity), the neutral zone (an in-between period of confusion that is also when new patterns can form), and new beginnings. Leaders tend to plan the change and neglect the endings.","points":["Change = situational; transition = psychological","Endings: letting go comes first","Neutral zone: confusion, but also creativity","New beginnings","Leaders under-manage endings"],"source":"William Bridges, Managing Transitions (1991)"},{"id":"chg-03","kind":"fact","prompt":"In Kotter's model, what is step one, and what did he call the most common reason transformations fail?","answer":"Establish a sense of urgency. The most common error is not establishing enough of it: allowing too much complacency.","why":"The eight steps: urgency; guiding coalition; vision and strategy; communicate the vision; empower broad action; short-term wins; consolidate gains; anchor in the culture.","source":"John Kotter, Leading Change: Why Transformation Efforts Fail (HBR, 1995)"},{"id":"chg-04","kind":"concept","prompt":"Why does Kotter insist on planned short-term wins, and what makes a win count?","answer":"Long efforts lose momentum and give skeptics ammunition. Visible wins show that the sacrifice is paying off, reward the people driving the change, undermine cynics, and keep sponsors on board. To count, a win must be visible, unambiguous, and clearly tied to the change, and it has to be planned rather than hoped for.","points":["Sustains momentum and sponsor support","Rewards change agents; undercuts cynics","Visible, unambiguous, tied to the change","Planned, not hoped for"],"source":"Kotter, Leading Change (1996)"},{"id":"chg-05","kind":"fact","prompt":"Prosci's ADKAR: the five elements, in order.","answer":"Awareness, Desire, Knowledge, Ability, Reinforcement.","why":"As a diagnostic, find the first element that is missing. Training (Knowledge, Ability) fails if Awareness or Desire is absent.","source":"Jeff Hiatt, ADKAR (2006)"},{"id":"chg-06","kind":"fact","prompt":"Rogers' adopter categories, with their shares.","answer":"Innovators 2.5%, early adopters 13.5%, early majority 34%, late majority 34%, laggards 16%.","why":"Early adopters are the opinion leaders the early majority watches. Recruit them before trying to convince everyone.","source":"Everett Rogers, Diffusion of Innovations"},{"id":"chg-07","kind":"fact","prompt":"The Heaths' three-part framework for change in Switch.","answer":"Direct the Rider (the rational side: give clear direction), motivate the Elephant (the emotional side: make people feel it), and shape the Path (change the environment so the behavior is easier).","source":"Chip & Dan Heath, Switch (2010)"},{"id":"chg-08","kind":"concept","prompt":"Why is changing the default often more effective than persuasion?","answer":"People disproportionately stay with whatever happens if they do nothing (status quo bias, inertia, an implied endorsement). Making the desired behavior the default, with an easy opt-out, changes behavior far more than information campaigns do. The classic evidence is automatic enrollment in retirement savings plans, which sharply raised participation among new hires.","points":["Status quo bias and inertia","Defaults signal an implied recommendation","Opt-out defaults beat persuasion","Evidence: automatic retirement-plan enrollment"],"source":"Madrian & Shea, The Power of Suggestion (QJE, 2001); Thaler & Sunstein, Nudge (2008)"},{"id":"chg-09","kind":"judgment","prompt":"You're rolling out a new standard that teams didn't ask for, and a respected team lead is openly resisting. What do you do?","answer":"Treat the resistance as information: find out what it protects, whether that's workload, a real flaw, or a loss of control or status. Involve the resister in shaping the rollout. Lower the cost of adoption through templates, defaults and help. Start with willing early adopters and a visible win. Separate can't (knowledge, ability) from won't (desire), because they need different responses. Reinforce and recognize the people who adopt it.","points":["Resistance as information: what does it protect?","Involve resisters in design","Reduce adoption cost (templates, defaults, help)","Early adopters and a visible win first","Diagnose can't vs won't","Reinforce and recognize adoption"],"source":"Synthesis: ADKAR; Rogers; Heath & Heath"}]},{"deck":"lrn","code":"LRN","title":"Learning & capability building","blurb":"How adults build skill, why training usually doesn't change behavior, and how to design it so it does.","cards":[{"id":"lrn-01","kind":"fact","prompt":"Kirkpatrick's four levels of training evaluation, in order.","answer":"1. Reaction. 2. Learning. 3. Behavior. 4. Results.","why":"Most programs stop at level 1 (did they like it?). Level 3 (are they doing it on the job?) is where skills training succeeds or fails.","source":"Kirkpatrick & Kirkpatrick, Four Levels of Training Evaluation (2016)"},{"id":"lrn-02","kind":"concept","prompt":"What are 'desirable difficulties', and what trap do they create when you evaluate training?","answer":"Spacing, interleaving, retrieval practice and generation make practice feel harder and look worse in the moment, but they improve long-term retention and transfer. The trap is that performance during training is not learning, so smooth, easy sessions get good reviews and teach less.","points":["Spacing, interleaving, retrieval, generation","Feel harder and look worse in the moment","Better long-term retention and transfer","In-session performance and satisfaction are poor proxies for learning"],"source":"Bjork & Bjork (2011); Soderstrom & Bjork (2015)"},{"id":"lrn-03","kind":"fact","prompt":"The Dreyfus model's five stages of skill acquisition, and what novices need compared with experts.","answer":"Novice, advanced beginner, competent, proficient, expert. Novices need explicit, context-free rules and checklists. Experts act from intuition built on many cases, so rules slow them down. Teach each stage differently.","source":"Dreyfus & Dreyfus (1980); Mind over Machine (1986)"},{"id":"lrn-04","kind":"concept","prompt":"The worked-example effect: what is it, and when does it reverse?","answer":"For novices, studying worked examples teaches more than solving the same problems unaided, because problem solving uses up working memory on search rather than on learning the structure. As learners gain expertise the benefit fades and can reverse (the expertise reversal effect), so fade the examples into independent practice.","points":["Novices learn more from studying worked examples","Problem solving overloads working memory with search","Expertise reversal: the benefit fades with skill","Fade from examples to independent practice"],"source":"Sweller, cognitive load theory; Kalyuga et al. (2003)"},{"id":"lrn-05","kind":"concept","prompt":"What is the curse of knowledge, and what is the classic demonstration?","answer":"Once you know something, it is hard to imagine not knowing it, so experts skip steps and overestimate how clear they are. In Elizabeth Newton's tapping study, people who tapped out well-known songs predicted listeners would name about half of them. Listeners named about 1 in 40. Fix it by testing explanations on real novices and leading with concrete examples.","points":["Experts can't simulate not knowing","Tappers predicted ~50%; listeners got ~2.5%","Explanations skip steps","Test on novices; lead with concrete examples"],"source":"Elizabeth Newton, Stanford dissertation (1990); Heath & Heath, Made to Stick (2007)"},{"id":"lrn-06","kind":"concept","prompt":"What is the illusion of explanatory depth, and how do you use it when interviewing people about a process?","answer":"People believe they understand how something works in far more detail than they do. Asking them to explain the mechanism step by step exposes the gaps. Ask 'Walk me through how this number gets produced, from intake to report' rather than 'Do you understand the process?'","points":["Overestimated understanding of mechanisms","Step-by-step explanation reveals gaps","Interview with walk-throughs, not yes/no comprehension checks"],"source":"Rozenblit & Keil, The misunderstood limits of folk science (2002)"},{"id":"lrn-07","kind":"fact","prompt":"Wenger's three structural elements of a community of practice.","answer":"Domain (the shared area of concern), community (the people and their relationships), and practice (the shared repertoire of tools, methods and stories).","source":"Wenger, McDermott & Snyder, Cultivating Communities of Practice (2002)"},{"id":"lrn-08","kind":"judgment","prompt":"Design a tools training that changes what people do on the job, not just what they know.","answer":"Build it on their real tasks and their own data. Run short sessions spaced over weeks, with participants building and retrieving rather than watching demos. Interleave skills, and give an on-the-job assignment between sessions. Back it with office hours and a network of champions. Measure behavior (Kirkpatrick level 3): are they using the shared, approved assets, and is their work being reused?","points":["Real tasks and real data","Spaced short sessions; building and retrieval over demos","On-the-job assignments between sessions","Office hours and champions for follow-through","Measure level 3 behavior"],"source":"Synthesis: Kirkpatrick; Bjork"}]},{"deck":"ldr","code":"LDR","title":"Leadership","blurb":"Influence, decisions, feedback and teams: principles for leading work you don't fully control.","cards":[{"id":"ldr-01","kind":"concept","prompt":"What is psychological safety, and what is it not?","answer":"A shared belief that the team is safe for interpersonal risk-taking: asking questions, admitting mistakes, raising concerns. It is not niceness, comfort or lowered standards. Edmondson pairs it with accountability: high safety plus high standards is the learning zone, and high safety with low standards is just comfort.","points":["Shared belief that interpersonal risk is safe","Not niceness or lowered standards","Safety plus accountability = learning zone","Safety without standards = comfort zone"],"source":"Amy Edmondson (1999); The Fearless Organization (2018)"},{"id":"ldr-02","kind":"concept","prompt":"Heifetz distinguishes technical problems from adaptive challenges. What's the difference, and what's the classic leadership failure?","answer":"A technical problem has a known solution that an expert or authority can implement. An adaptive challenge requires the people who have the problem to learn and change their values, habits or loyalties, so no one can solve it for them. The classic failure is treating an adaptive challenge as a technical one, such as buying a tool to fix a culture problem.","points":["Technical: known solution, expert can apply it","Adaptive: the people with the problem must change","Authority can't solve adaptive challenges by itself","Failure: applying technical fixes to adaptive problems"],"source":"Ronald Heifetz, Leadership Without Easy Answers (1994)"},{"id":"ldr-03","kind":"concept","prompt":"Cohen and Bradford's model of influence without authority: how does it work?","answer":"Treat the other person as a potential ally. Clarify what you need, then understand their world: their pressures, goals and what they value, their 'currencies'. Influence comes from exchange: offer what they value (help, information, recognition, access) in return for what you need, and build the relationship so the exchanges continue.","points":["Assume a potential ally","Clarify your goals","Diagnose their world and currencies","Exchange what they value for what you need","Invest in the relationship"],"source":"Cohen & Bradford, Influence Without Authority (1990)"},{"id":"ldr-04","kind":"fact","prompt":"Situational leadership: the four styles, and what decides which to use.","answer":"Directing, coaching, supporting, delegating. The choice depends on the person's development level on that specific task: their competence and commitment, not their seniority.","why":"The same person can need directing on a new task and delegating on a familiar one.","source":"Hersey & Blanchard; Blanchard, SLII"},{"id":"ldr-05","kind":"fact","prompt":"The SBI feedback model.","answer":"Situation, Behavior, Impact. Name when and where, describe the observable behavior (not character or intent), and say what effect it had. Then ask for their view.","source":"Center for Creative Leadership"},{"id":"ldr-06","kind":"fact","prompt":"Bain's RAPID decision roles.","answer":"Recommend, Agree, Perform, Input, Decide. Exactly one person holds the D.","why":"Most decision gridlock comes from unclear D, or from too many people who believe they hold an A (a veto).","source":"Rogers & Blenko, Who Has the D? (HBR, 2006)"},{"id":"ldr-07","kind":"fact","prompt":"Tuckman's stages of team development.","answer":"Forming, storming, norming, performing, plus adjourning, added in 1977.","why":"Storming is normal, not a sign the team is failing. A team skips it only by suppressing conflict.","source":"Tuckman (1965); Tuckman & Jensen (1977)"},{"id":"ldr-08","kind":"concept","prompt":"What is Chesterton's fence, and how does it apply to legacy rules and systems?","answer":"Don't remove a fence until you know why it was put up. With an odd validation rule, a manual step or a strange table, find out what problem it solved. Then decide: the reason may be gone, or the fence may be holding up something you can't see.","points":["Understand why before removing","Legacy oddities often encode past failures","The reason may have expired, or may still hold","Then decide deliberately"],"source":"G. K. Chesterton, The Thing (1929)"},{"id":"ldr-09","kind":"concept","prompt":"'Disagree and commit': what does it require of you before and after the decision?","answer":"Before: state your disagreement fully and clearly while the decision is still open. After: commit to making the decision succeed. No relitigating, no quiet foot-dragging, no 'I told you so'. Reopen it only with new information, through the channel that made it.","points":["Voice disagreement fully before the decision","Then commit to making it work","No relitigating or passive resistance","Reopen only with new information"],"source":"Intel management practice (Andy Grove); Bezos, 2016 shareholder letter"},{"id":"ldr-10","kind":"judgment","prompt":"Your sponsor wants a visible win in 90 days, but the foundational work will take a year. How do you handle it?","answer":"Don't choose between them. Pick a thin end-to-end slice on a high-visibility use case that also delivers one reusable piece of the foundation. Make foundation progress visible with a few honest metrics. Set expectations explicitly with a roadmap that shows what the win does and doesn't prove. Avoid one-off hacks that create debt, and raise risks early rather than at the deadline.","points":["A thin end-to-end slice that also builds foundation","Choose a high-visibility use case","Make foundation progress visible","Explicit roadmap and expectations","Avoid one-off hacks; surface risks early"],"source":"Synthesis: Kotter (short-term wins); product practice"},{"id":"ldr-11","kind":"judgment","prompt":"A vendor says a capability you need is 'supported.' How do you hold them to it before and after you sign?","answer":"Turn the capability into testable acceptance criteria in your own terms: the systems, versions and scope it must work on. Require a proof of concept on your own environment and data, with a known test case and its expected result. Ask for reference customers with a similar setup, and separate what ships today from what's on the roadmap. Put the criteria, the timeline and the remedy for failure into the contract.","points":["Testable acceptance criteria in your own terms (systems, versions, scope)","Proof of concept on your own environment and data, with an expected result","Reference customers with a similar setup","Separate what ships today from the roadmap","Criteria, timeline and remedy in the contract"],"source":"Standard procurement practice (acceptance testing, proof of concept)"}]}];
